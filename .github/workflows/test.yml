name: test

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger to opt into the macOS lane on demand. The default
  # matrix is Ubuntu-only because macos-latest is billed 10× the
  # standard rate (and produces rate-limit notification noise on every
  # PR). Run macOS via the Actions UI / `gh workflow run test.yml -f
  # include_macos=true` when touching the macOS-specific build paths
  # (mlx backend, libtorch macOS lane, brew chezscheme detection, etc.).
  workflow_dispatch:
    inputs:
      include_macos:
        description: 'Include macos-latest in the matrix (10× billable)'
        type: boolean
        default: false

jobs:
  # Fast preflight: catches drift between Idris example defaults and the
  # paired torch_ref/scripts/*.py argparse defaults. Runs in ~1s on any
  # python3-capable runner; gates the matrix so a paired-side desync fails
  # the build without burning ~220 minute-units on the long matrix.
  check-paired-defaults:
    name: check-paired-defaults
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify paired Idris ↔ torch_ref defaults match
        run: python3 scripts/check-paired-defaults.py
      - name: Verify FFI wrap-on-return template invariants
        # Catches: (a) new Tensor-touching %foreign decls written as
        # %foreign "C:..." instead of scheme-wrapped, (b) hand-edited
        # scheme bodies missing the vector-ref unwrap or the wrap/retain
        # on T return. See docs/develop/tensor-lifecycle-plan.md.
        run: make check-ffi-wrap-template
      - name: Verify %foreign decls are correctly IO-typed
        # Catches the bug class fixed by the IO refactor (commits leading
        # up to e337512): side-effecting C calls bound to non-IO Idris
        # types, where `let _ =` bindings get DCE'd and `pure (...)`
        # fires the FFI before sequencing. Known dead surfaces are
        # skip-listed in the script.
        run: make check-non-io-side-effects

  test-examples:
    name: test-examples (${{ matrix.os }})
    needs: check-paired-defaults
    strategy:
      fail-fast: false
      matrix:
        # macOS is opt-in via `workflow_dispatch -f include_macos=true`
        # to avoid the 10× billable cost on every PR. See the
        # workflow_dispatch input above.
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.include_macos) && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Chez Scheme + BLAS (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme build-essential libopenblas-dev

      - name: Install Chez Scheme + coreutils (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install chezscheme coreutils
        # coreutils gives us gtimeout (test-examples falls back to it when
        # `timeout` isn't on PATH — macOS doesn't ship one). We deliberately
        # do NOT add libexec/gnubin to PATH: that would expose `stdbuf`
        # without the `g` prefix, but brew's libstdbuf.so is built for arm64
        # while macOS's inserted-library loader requires arm64e — every
        # binary linking system frameworks (i.e. ours) would abort with
        # "incompatible architecture". The Makefile's $(STDBUF) probe
        # correctly returns empty when `stdbuf` is off PATH, so no buffering
        # is applied on macOS CI.

      # Idris 2 v0.8.0 built from source, cached across runs to avoid the
      # 5-10 min bootstrap on every push. Idris2's default PREFIX is
      # $HOME/.idris2 — caching that whole tree (binary + libs) is simplest.
      # Bump the cache key suffix to force a rebuild.
      - name: Cache Idris 2
        id: idris2-cache
        uses: actions/cache@v4
        with:
          path: ~/.idris2
          key: idris2-v0.8.0-${{ matrix.os }}-v2

      - name: Build and install Idris 2
        if: steps.idris2-cache.outputs.cache-hit != 'true'
        run: |
          # Locate Chez Scheme. Binary name varies: Ubuntu `chezscheme`
          # package installs `scheme`; brew `chezscheme` may install `scheme`,
          # `chez-scheme`, `chez`, or be keg-only.
          SCHEME="$(command -v scheme || command -v chez-scheme || command -v chezscheme || command -v chez || true)"
          if [ -z "$SCHEME" ] && command -v brew >/dev/null 2>&1; then
            BREW_PREFIX="$(brew --prefix chezscheme 2>/dev/null || true)"
            if [ -n "$BREW_PREFIX" ] && [ -d "$BREW_PREFIX/bin" ]; then
              echo "brew --prefix chezscheme: $BREW_PREFIX"
              echo "Cellar bin contents:"
              ls -la "$BREW_PREFIX/bin/" || true
              for name in scheme chez-scheme chezscheme chez petite; do
                if [ -x "$BREW_PREFIX/bin/$name" ]; then
                  SCHEME="$BREW_PREFIX/bin/$name"
                  break
                fi
              done
            fi
          fi
          if [ -z "$SCHEME" ]; then
            echo "Chez Scheme not found. Debug info:" >&2
            echo "PATH=$PATH" >&2
            command -v brew >/dev/null && brew list chezscheme 2>&1 || true
            ls /opt/homebrew/bin/ 2>&1 | grep -iE 'chez|scheme|petite' >&2 || true
            ls /usr/local/bin/ 2>&1 | grep -iE 'chez|scheme|petite' >&2 || true
            exit 1
          fi
          echo "Using SCHEME=$SCHEME"
          git clone --branch v0.8.0 --depth 1 https://github.com/idris-lang/Idris2.git /tmp/Idris2
          cd /tmp/Idris2
          make bootstrap SCHEME="$SCHEME"
          make install

      - name: Add Idris 2 to PATH
        run: echo "$HOME/.idris2/bin" >> $GITHUB_PATH

      - name: Verify Idris 2
        run: idris2 --version

      - name: Install MLX (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # MLX is Apple-only. Pip wheel ships C++ headers + libs in
          # the package's site-packages dir under {include,lib}. The
          # Makefile's BACKEND=mlx rules read MLX_SITE to find them.
          # --break-system-packages is required on Python >=3.12 (PEP 668)
          # and is fine on ephemeral CI runners.
          #
          # mlx 0.31+ split into a namespace package (mlx + mlx-metal),
          # so `mlx.__file__` is None and the C++ headers moved to the
          # mlx-metal package. Detection tries both packages and picks
          # whichever has the {include,lib} subdirs.
          python3 -m pip install --break-system-packages mlx
          MLX_SITE=$(python3 -c "
          import importlib.util, os, sys
          for name in ('mlx', 'mlx_metal'):
              spec = importlib.util.find_spec(name)
              if not spec: continue
              path = spec.submodule_search_locations[0] if spec.submodule_search_locations \
                  else os.path.dirname(spec.origin)
              if os.path.isdir(os.path.join(path, 'include')):
                  print(path); sys.exit(0)
          sys.exit(1)
          ")
          echo "MLX_SITE=$MLX_SITE" >> $GITHUB_ENV

      # Torch is Linux-only here (libtorch CPU is bigger; macOS lane already
      # carries MLX). Cache the uv-managed venv to skip the ~2 min download
      # on warm runs. The Makefile's LIBTORCH_PATH detection chain
      # (Makefile:73-81) finds `packages/pytorch/.venv/bin/python3 -c
      # "import torch ..."` automatically once the venv exists.
      - name: Cache pytorch venv (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: packages/pytorch/.venv
          key: pytorch-venv-${{ runner.os }}-${{ hashFiles('packages/pytorch/uv.lock') }}

      - name: Install torch via uv (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          make ref-setup

      - name: Build tape backend
        run: make BACKEND=tape backend

      - name: Install libraries
        run: make install

      - name: Verify GradMode gate (NoGrad loss rejected at compile)
        # Asserts the type-level gate `nativeTrainStep : ... -> Tensor [] d
        # WithGrad -> Double` still rejects a `NoGrad` loss. If this step
        # ever passes the negative test (i.e. the gate compiles a NoGrad
        # loss), the "inference loss silently no-ops training" bug class
        # has regressed.
        run: make check-gradmode-gate

      - name: Verify GradMode aliasing rejection (linear freezeNetwork)
        # Asserts that linear `freezeNetwork` consumes its input — using
        # the pre-freeze Network reference afterwards must be a compile
        # error. Prevents the "freeze net, train via original variable
        # which silently no-ops" footgun.
        run: make check-gradmode-aliasing

      # C backend FFI tests (test_backend.c) per available backend. These
      # build their own backend + exercise the C autograd/optimizer/param
      # surface directly — faster and more fundamental than the example
      # sweep, so they run first. Per-OS: tape everywhere, torch on Ubuntu
      # (libtorch installed via uv), mlx on macOS (MLX_SITE set above).
      - name: Run C backend tests (tape)
        run: make test-backend-tape

      - name: Run C backend tests (torch, Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: make test-backend-torch

      - name: Run C backend tests (mlx, macOS)
        if: matrix.os == 'macos-latest'
        run: make test-backend-mlx

      - name: Run safetensors round-trip (tape)
        # F32/F64 param + optimizer-state round-trip; runs on every OS.
        run: make test-safetensors

      - name: Run safetensors round-trip (torch, Ubuntu)
        # Adds the bf16/f16/i32 byte-level round-trip (those dtypes exist
        # only on torch). Gated to the libtorch lane.
        if: matrix.os == 'ubuntu-latest'
        run: make BACKEND=torch test-safetensors

      - name: Run integration tests
        # No SKIP_EXAMPLES: the mlx allocator aborts that used to skip
        # ntm-copy / ntm-associative-recall / dnc-recall / mountain-car-cont
        # are fixed by the generation-scoped free (see
        # docs/develop/tensor-lifecycle.md). The whole matrix runs.
        run: make test-examples EXAMPLE_TIMEOUT=900

      - name: Checkpoint resume smoke test
        # Trains gpt 10 epochs to a checkpoint dir, resumes to 20, and
        # asserts the sidecar epoch + resume log + completion. Gates the
        # Train.idr / Checkpoint.idr auto-save / resume integration.
        run: make test-checkpoint-resume
