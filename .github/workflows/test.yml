name: test

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger to opt into the macOS lane on demand. The default
  # matrix is Ubuntu-only because macos-latest is billed 10× the
  # standard rate (and produces rate-limit notification noise on every
  # PR). Run macOS via the Actions UI / `gh workflow run test.yml -f
  # include_macos=true` when touching the macOS-specific build paths
  # (mlx backend, libtorch macOS lane, brew chezscheme detection, etc.).
  workflow_dispatch:
    inputs:
      include_macos:
        description: 'Include macos-latest in the matrix (10× billable)'
        type: boolean
        default: false

jobs:
  # Fast preflight: catches drift between Idris example defaults and the
  # paired torch_ref/scripts/*.py argparse defaults. Runs in ~1s on any
  # python3-capable runner; gates the matrix so a paired-side desync fails
  # the build without burning ~220 minute-units on the long matrix.
  check-paired-defaults:
    name: check-paired-defaults
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify paired Idris ↔ torch_ref defaults match
        run: python3 scripts/check-paired-defaults.py
      - name: Verify Executor backend method sets are in sync
        # Catches the drift bug class: someone wires a new method into
        # Tape's instance block and silently forgets Torch / Mlx (or
        # vice-versa). Compile-only coverage misses this — the missing
        # backend stays unspellable until someone tries to use it.
        run: make check-executor-method-drift
      - name: Verify generated instance method blocks match manifest
        # Catches: someone hand-edits a marker-bounded GENERATED block
        # in Executor/{Tape,Torch,Mlx}.idr without updating MANIFEST,
        # or adds a MANIFEST entry without re-running gen-executor-instances.
        # Pairs with check-executor-method-drift: that catches drift
        # ACROSS backends; this catches drift between MANIFEST and the
        # rendered instance bodies.
        run: make check-executor-instances

      - name: Verify FFI wrap-on-return template invariants
        # Catches: (a) new Tensor-touching %foreign decls written as
        # %foreign "C:..." instead of scheme-wrapped, (b) hand-edited
        # scheme bodies missing the vector-ref unwrap or the wrap/retain
        # on T return. See docs/develop/tensor-lifecycle-plan.md.
        run: make test-integration-lint-ffi-wrap-template
      - name: Verify %foreign decls are correctly IO-typed
        # Catches the bug class fixed by the IO refactor (commits leading
        # up to e337512): side-effecting C calls bound to non-IO Idris
        # types, where `let _ =` bindings get DCE'd and `pure (...)`
        # fires the FFI before sequencing. Known dead surfaces are
        # skip-listed in the script.
        run: make test-integration-lint-non-io-side-effects
      - name: Verify CI workflow is in sync with its spec
        # Re-runs scripts/gen-ci-workflow.py --check. Fails if anyone
        # hand-edited the test-invocation block of this workflow
        # without updating .github/workflows/test.yml.spec.json. Spec
        # is the single source of truth; add a gate by appending to
        # the spec and regenerating, not by editing the workflow.
        run: make lint-ci-workflow
      - name: Install uv + lint-only Python deps
        # `--only-group dev --no-install-project` installs ruff + vulture
        # + their transitive deps WITHOUT pulling in torch / transformers
        # / gymnasium / mlx (the main `[project]` deps). Cold-cache cost
        # ~5s; the heavier matrix jobs re-sync the full venv via
        # `make ref-setup`. Adds ~10s wall to the preflight; gates the
        # ~220 min-unit matrix on Python-side lint drift before it runs.
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          cd packages/pytorch && $HOME/.local/bin/uv sync --quiet --only-group dev --no-install-project
      - name: Lint Python surface (ruff + vulture)
        # Runs `make py-lint` which exercises ruff check + ruff format
        # --check + vulture (min-confidence 80% per pyproject.toml).
        # Use --no-sync so the partially-synced venv from the previous
        # step isn't filled with the heavy main deps.
        run: make lint-py
      - name: Install C-lint tools (cppcheck + clang-tidy)
        # apt-installs cppcheck + clang-tidy on the Ubuntu preflight
        # runner. ~10s on a warm cache. Local devs install via
        # `brew install cppcheck llvm` or the equivalent nix derivation.
        # The Make target gracefully skips when the tools aren't on
        # PATH so it doesn't block pre-commit runs locally.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck clang-tidy
      - name: Lint C / C++ backend surface (cppcheck + clang-tidy)
        # Runs `make c-lint`: cppcheck on all 3 backends + clang-tidy
        # on tape (tape uses only libc + BLAS headers; no libtorch /
        # mlx setup needed at preflight time). Full clang-tidy across
        # the C++ backends is gated behind `C_LINT_FULL_CLANG_TIDY=1`
        # and lands in the heavy matrix jobs (libtorch headers are
        # ~30s per TU). Conservative check set in `.clang-tidy`.
        run: make lint-c

  test-examples:
    name: test-examples (${{ matrix.os }})
    needs: check-paired-defaults
    strategy:
      fail-fast: false
      matrix:
        # macOS is opt-in via `workflow_dispatch -f include_macos=true`
        # to avoid the 10× billable cost on every PR. See the
        # workflow_dispatch input above.
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.include_macos) && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Chez Scheme + BLAS (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme build-essential libopenblas-dev

      - name: Install Chez Scheme + coreutils (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install chezscheme coreutils
        # coreutils gives us gtimeout (test-examples falls back to it when
        # `timeout` isn't on PATH — macOS doesn't ship one). We deliberately
        # do NOT add libexec/gnubin to PATH: that would expose `stdbuf`
        # without the `g` prefix, but brew's libstdbuf.so is built for arm64
        # while macOS's inserted-library loader requires arm64e — every
        # binary linking system frameworks (i.e. ours) would abort with
        # "incompatible architecture". The Makefile's $(STDBUF) probe
        # correctly returns empty when `stdbuf` is off PATH, so no buffering
        # is applied on macOS CI.

      # Idris 2 v0.8.0 built from source, cached across runs to avoid the
      # 5-10 min bootstrap on every push. Idris2's default PREFIX is
      # $HOME/.idris2 — caching that whole tree (binary + libs) is simplest.
      # Bump the cache key suffix to force a rebuild.
      - name: Cache Idris 2
        id: idris2-cache
        uses: actions/cache@v4
        with:
          path: ~/.idris2
          key: idris2-v0.8.0-${{ matrix.os }}-v2

      - name: Build and install Idris 2
        if: steps.idris2-cache.outputs.cache-hit != 'true'
        run: |
          # Locate Chez Scheme. Binary name varies: Ubuntu `chezscheme`
          # package installs `scheme`; brew `chezscheme` may install `scheme`,
          # `chez-scheme`, `chez`, or be keg-only.
          SCHEME="$(command -v scheme || command -v chez-scheme || command -v chezscheme || command -v chez || true)"
          if [ -z "$SCHEME" ] && command -v brew >/dev/null 2>&1; then
            BREW_PREFIX="$(brew --prefix chezscheme 2>/dev/null || true)"
            if [ -n "$BREW_PREFIX" ] && [ -d "$BREW_PREFIX/bin" ]; then
              echo "brew --prefix chezscheme: $BREW_PREFIX"
              echo "Cellar bin contents:"
              ls -la "$BREW_PREFIX/bin/" || true
              for name in scheme chez-scheme chezscheme chez petite; do
                if [ -x "$BREW_PREFIX/bin/$name" ]; then
                  SCHEME="$BREW_PREFIX/bin/$name"
                  break
                fi
              done
            fi
          fi
          if [ -z "$SCHEME" ]; then
            echo "Chez Scheme not found. Debug info:" >&2
            echo "PATH=$PATH" >&2
            command -v brew >/dev/null && brew list chezscheme 2>&1 || true
            ls /opt/homebrew/bin/ 2>&1 | grep -iE 'chez|scheme|petite' >&2 || true
            ls /usr/local/bin/ 2>&1 | grep -iE 'chez|scheme|petite' >&2 || true
            exit 1
          fi
          echo "Using SCHEME=$SCHEME"
          git clone --branch v0.8.0 --depth 1 https://github.com/idris-lang/Idris2.git /tmp/Idris2
          cd /tmp/Idris2
          make bootstrap SCHEME="$SCHEME"
          make install

      - name: Add Idris 2 to PATH
        run: echo "$HOME/.idris2/bin" >> $GITHUB_PATH

      - name: Verify Idris 2
        run: idris2 --version

      - name: Install MLX (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # MLX is Apple-only. Pip wheel ships C++ headers + libs in
          # the package's site-packages dir under {include,lib}. The
          # Makefile's BACKEND=mlx rules read MLX_SITE to find them.
          # --break-system-packages is required on Python >=3.12 (PEP 668)
          # and is fine on ephemeral CI runners.
          #
          # mlx 0.31+ split into a namespace package (mlx + mlx-metal),
          # so `mlx.__file__` is None and the C++ headers moved to the
          # mlx-metal package. Detection tries both packages and picks
          # whichever has the {include,lib} subdirs.
          python3 -m pip install --break-system-packages mlx
          MLX_SITE=$(python3 -c "
          import importlib.util, os, sys
          for name in ('mlx', 'mlx_metal'):
              spec = importlib.util.find_spec(name)
              if not spec: continue
              path = spec.submodule_search_locations[0] if spec.submodule_search_locations \
                  else os.path.dirname(spec.origin)
              if os.path.isdir(os.path.join(path, 'include')):
                  print(path); sys.exit(0)
          sys.exit(1)
          ")
          echo "MLX_SITE=$MLX_SITE" >> $GITHUB_ENV

      # Torch is Linux-only here (libtorch CPU is bigger; macOS lane already
      # carries MLX). Cache the uv-managed venv to skip the ~2 min download
      # on warm runs. The Makefile's LIBTORCH_PATH detection chain
      # (Makefile:73-81) finds `packages/pytorch/.venv/bin/python3 -c
      # "import torch ..."` automatically once the venv exists.
      - name: Cache pytorch venv (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: packages/pytorch/.venv
          key: pytorch-venv-${{ runner.os }}-${{ hashFiles('packages/pytorch/uv.lock') }}

      - name: Install torch via uv (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          make ref-setup

      - name: Build tape backend
        run: make BACKEND=tape backend

      - name: Install libraries
        run: make install

      # >>> GENERATED FROM test.yml.spec.json >>>
      - name: Run idris-transformers unit tests
        # Pure-Idris test harness for the HF-aligned model package
        # (packages/idris-transformers/). Type-checks the package + builds
        # the test executable, then runs it. No backend dependency at this
        # stage — the package wiring is the gate; HfBert model tests land
        # alongside HfBert.idr in a later commit.
        run: make test-unit-idris-transformers

      - name: Run HfBert oracle generator + pytest (Ubuntu)
        # Drives packages/idris-transformers/scripts/save_oracle.py through
        # pytest under the pytorch uv venv (carries the transformers dep).
        # Downloads google/bert_uncased_L-2_H-128_A-2 from HF Hub on each
        # run, runs forward on the fixed input, asserts the resulting
        # oracle is shape [128] F32 finite + non-trivial. Ubuntu-only:
        # ref-setup runs only there in this matrix.
        if: matrix.os == 'ubuntu-latest'
        run: make test-e2e-transformers-oracle-bert

      - name: Run HfGpt2 oracle generator + pytest (Ubuntu)
        # Same shape as the HfBert oracle gate but for sshleifer/tiny-gpt2.
        # Downloads the checkpoint, runs forward on [15496, 995], asserts
        # the last-position hidden state is shape [2] (sshleifer/tiny-gpt2
        # is intentionally degenerate at hidden=2 — exercises the
        # architectural pieces without burning CI disk). Ubuntu-only.
        if: matrix.os == 'ubuntu-latest'
        run: make test-e2e-transformers-oracle-gpt2

      - name: Run HfBert end-to-end roundtrip (Ubuntu)
        # The cross-language correctness gate: regenerates the Python
        # oracle, runs the Idris HfBertInference example (loading the
        # real Google bert-tiny weights via the HF-aligned HfBert
        # module), and asserts elementwise agreement within
        # max-abs-diff 1e-3 on the 128-dim pooled [CLS] output.
        # Currently passes at 4.1e-4 locally on tape. Ubuntu-only:
        # depends on the uv venv set up by ref-setup.
        if: matrix.os == 'ubuntu-latest'
        run: make test-e2e-hf-bert-roundtrip

      - name: Run HfGpt2 end-to-end roundtrip (Ubuntu)
        # Same gate shape as HfBert but for GPT-2: regenerate the Python
        # oracle from hf-internal-testing/tiny-random-gpt2, run the Idris
        # HfGpt2Inference binary, assert the 32-dim last-position hidden
        # state matches within max-abs-diff 1e-3. Currently passes at
        # ~1e-6 locally on tape. Ubuntu-only: depends on the uv venv.
        if: matrix.os == 'ubuntu-latest'
        run: make test-e2e-hf-gpt2-roundtrip

      - name: Run HfBitNet end-to-end roundtrip (Ubuntu, torch)
        # Cross-language gate: regenerate the Python oracle from
        # microsoft/bitnet-b1.58-2B-4T, run the Idris HfBitNetInference
        # binary --dump-logits, assert argmax on the vocab-128256 logit
        # row matches the HF oracle at max-abs-diff 1.0. BACKEND=torch
        # because tape F64 on a ~2B-param model OOMs the 14 GB Ubuntu
        # runner (see Low-priority TODO "Tape F64 large-LM OOM"). BitNet
        # is not license-gated, so no HF_TOKEN handling needed.
        if: matrix.os == 'ubuntu-latest'
        run: make BACKEND=torch test-e2e-hf-bitnet-roundtrip

      - name: Run HfLlama end-to-end roundtrip (Ubuntu, torch, HF_TOKEN-gated)
        # Cross-language gate for Llama 3.2 1B. Regenerates the Python
        # oracle from meta-llama/Llama-3.2-1B (license-gated), runs the
        # Idris HfLlamaInference binary --dump-final-hidden, asserts the
        # 2048-dim last-position hidden state matches the oracle within
        # max-abs-diff 1.0. Currently passes at 4.96e-05 on torch-mps
        # and 1.20e-04 on mlx-gpu in local dev runs; the CI torch-cpu
        # lane carries the same Idris-side numerics through libtorch CPU.
        # Step skips cleanly when HF_TOKEN is unset in repo/org secrets
        # (forks without the token won't see a failing step). BACKEND=torch
        # because tape F64 doesn't fit (~10 GB params + arena vs ~14 GB
        # runner RAM); see Low-priority TODO "Tape F64 large-LM OOM".
        if: matrix.os == 'ubuntu-latest' && env.HF_TOKEN != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: make BACKEND=torch test-e2e-hf-llama-roundtrip

      - name: Run HfLlama multi-step generation roundtrip (Ubuntu, torch, HF_TOKEN-gated)
        # Cross-language gate for Llama 3.2 1B's *generation* path.
        # The companion `test-e2e-hf-llama-roundtrip` step above tests a
        # single forward on one fixed token; this step exercises the
        # full greedy-decode loop: tokenize "The capital of France
        # is", generate 4 tokens via `genLoop` (no KV cache yet —
        # bumps to 8+ once KV cache lands), assert the resulting
        # token-ID sequence matches HF `model.generate(do_sample=
        # False, use_cache=True)` element-wise. Catches drift in
        # tokenization, every layer of the forward, argmax, and the
        # per-step glue that the single-forward gate can't see.
        #
        # Same HF_TOKEN gating + BACKEND=torch as the sibling step.
        # Currently more expensive than the single-forward gate (4
        # forwards on growing sequences); the KV cache landing will
        # collapse it back to ~constant per step.
        if: matrix.os == 'ubuntu-latest' && env.HF_TOKEN != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: make BACKEND=torch test-e2e-hf-llama-generate-roundtrip

      - name: Verify GradMode gate (NoGrad loss rejected at compile)
        # Asserts the type-level gate `nativeTrainStep : ... -> Tensor [] d
        # WithGrad -> Double` still rejects a `NoGrad` loss. If this step
        # ever passes the negative test (i.e. the gate compiles a NoGrad
        # loss), the "inference loss silently no-ops training" bug class
        # has regressed.
        run: make test-integration-typegate-gradmode

      - name: Verify GradMode aliasing rejection (linear freezeNetwork)
        # Asserts that linear `freezeNetwork` consumes its input — using
        # the pre-freeze Network reference afterwards must be a compile
        # error. Prevents the "freeze net, train via original variable
        # which silently no-ops" footgun.
        run: make test-integration-typegate-gradmode-aliasing

      - name: Verify cross-family lossless-cast gate (DType.Core.LosslessTo)
        # Asserts LosslessTo refuses a mantissa-shrinking direction
        # (F32 to BF16). Prevents silent precision-losing mid-graph
        # casts. Pairs with the positive Test.Lossless suite.
        run: make test-integration-typegate-lossy-cast

      - name: Verify int-overflow lossless-cast gate (#412 F1)
        # Asserts LosslessTo refuses I64 to F32 (max int value far
        # exceeds F32 mantissa exact-integer ceiling). Pairs with the
        # I32 to F64 + U8 to F32 positive cases in Test.Lossless.
        run: make test-integration-typegate-int-overflow-cast

      - name: Run Tier-1 perf benches + render BENCHMARKS.md + perf-regression gate
        # Axis A op-kernel benches (matmul / softmax / SDPA / embedding /
        # RMSNorm) on tape vs PyTorch. Appends kind="op_bench" entries to
        # perf-log.jsonl and regenerates BENCHMARKS.md. The follow-up
        # lint asserts BENCHMARKS.md is in sync with the log — catches a
        # hand-edit of BENCHMARKS.md that drifts from the JSONL truth.
        # Framework + selection rule: docs/develop/testing-taxonomy.md
        # (Axis A/B/C/D coverage). Tier 1 cadence: every PR (target
        # wall <= 5 min).
        run: make test-perf-fast && make test-integration-lint-benchmarks && make test-integration-lint-perf-regression

      - name: Run perf-regression gate (kind="run" entries, advisory)
        # Companion to the kind="op_bench" gate above. Groups
        # perf-log.jsonl `kind="run"` entries by (example, backend,
        # args), medians the last 10, and reports OK / WARN (>15%)
        # / FAIL (>100% slower) for the latest entry per cell.
        # Advisory only — exits 0 even on FAILs — until the noise
        # profile is calibrated; promote by setting PERF_GATE=1.
        # Renders the report in the CI logs regardless.
        run: make lint-perf-run

      - name: Run coverage gap probe (advisory)
        # C backend FFI tests per available backend, via the Criterion
        # harness under `packages/backends/test/`. Per-OS: tape everywhere,
        # torch on Ubuntu (libtorch installed via uv), mlx on macOS
        # (MLX_SITE set above). The legacy `test_backend.c` monolith was
        # retired with the Criterion port — every assertion lives under
        # `test/common/test_legacy_backend.c` for now, slated for a
        # per-op file split during the structural Phase 6 work.
        #
        # Static probe: parses OP_* enums from backend_<b>/tape.h and
        # extern "C" decls from backend.h, cross-references against
        # test/. Writes CSVs to build/coverage-gap-{ops,symbols}.csv.
        # Exit code is advisory today (0 even on gaps); coverage-policy.md
        # flips this to gating once W3+W4 close. See
        # docs/develop/coverage-policy.md for the three-axis target.
        run: make test-coverage-gap-probe

      - name: Run Criterion suite (tape)
        run: make BACKEND=tape test-unit-c

      - name: Run Criterion suite under ASan + UBSan (tape, Ubuntu)
        # AddressSanitizer + UndefinedBehaviorSanitizer pass over the
        # C tape backend + Criterion suite. The Makefile target sets
        # EXTRA_CFLAGS='-fsanitize=address,undefined ...' on top of the
        # stock -O2 build and lands the artifacts in a distinct
        # `build/<key>-asan/` tree (via the ASAN axis in BUILD_KEY)
        # so the warm tree stays clean.
        #
        # First runs may surface latent UB sites — `continue-on-error:
        # true` keeps this advisory until the first cleanup commits
        # land; promote to hard-fail by dropping that line. mlx + torch
        # lanes are deferred (mlx-Metal + asan interactions are messy;
        # libtorch + asan is supported but slow to set up).
        #
        # Ubuntu-only because asan on macOS requires a separate
        # instrumented runtime and clang invocation.
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: make test-unit-c-asan-tape

      - name: Run Idris unit suite (tape)
        # Idris-side smart-constructor / LayerLike / Tensor-lifecycle suite
        # against the tape primary. The test buckets that touch the C
        # surface (GradMode, ManagedHandle) use `{d=TestExecutor}` which the
        # Makefile-generated `TestConfig.idr` resolves to TapeExecutor here, so
        # FFI calls land on tape-suffixed C symbols.
        run: make BACKEND=tape test-unit-idris-ml

      - name: Run Criterion suite (torch, Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: make BACKEND=torch test-unit-c

      - name: Run Idris unit suite (torch, Ubuntu)
        # Same suite as the tape lane but with TestExecutor = TorchExecutor TCpu.
        # Catches Idris-side regressions that a tape-only run would miss
        # (broken torch Scheme wrapper, drift in `UserExecutorTransfer`
        # instances, etc.).
        if: matrix.os == 'ubuntu-latest'
        run: make BACKEND=torch test-unit-idris-ml

      - name: Run Criterion suite (mlx, macOS)
        if: matrix.os == 'macos-latest'
        run: make BACKEND=mlx test-unit-c

      - name: Run Idris unit suite (mlx, macOS)
        # Same suite as tape/torch but with TestExecutor = MlxExecutor MCpu.
        # Catches mlx Scheme-wrapper drift, lazy-eval / handle-lifetime
        # regressions in the test-managed-handle suite under Metal.
        if: matrix.os == 'macos-latest'
        run: make BACKEND=mlx test-unit-idris-ml

      - name: Run examples unit suite (tape)
        # Idris-side suite living in packages/idris-ml-examples (Test.Reinforce,
        # Test.Generate). Wired in to catch drift like the IO-lift mismatch on
        # rolloutEpBatched and the bitlinear-test scale formula — both pre-existed
        # in tree because the target was not previously gated by CI.
        run: make BACKEND=tape test-unit-examples

      - name: Run examples unit suite (torch, Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: make BACKEND=torch test-unit-examples

      - name: Run examples unit suite (mlx, macOS)
        if: matrix.os == 'macos-latest'
        run: make BACKEND=mlx test-unit-examples

      - name: Run multi-backend Idris suite (macOS)
        # Adds Test.Transfer (cross-backend `toExecutor` smoke) +
        # Test.MultiExecutorRegistry (registry isolation invariant) on
        # top of the per-backend buckets. Forces BACKEND=torch,tape,mlx
        # so all three sets of C symbols are linked — only feasible on
        # the macOS lane (Ubuntu has no mlx).
        if: matrix.os == 'macos-latest'
        run: make test-unit-multi-backend

      - name: Run safetensors round-trip (tape)
        # F32/F64 param + optimizer-state round-trip; runs on every OS.
        # Re-installs the tape dylib so subsequent steps that expect
        # tape symbols (test-e2e-examples default lane) see them.
        run: make BACKEND=tape test-unit-safetensors

      - name: Run safetensors round-trip (torch, Ubuntu)
        # Adds the bf16/f16/i32 byte-level round-trip (those dtypes exist
        # only on torch). Gated to the libtorch lane.
        if: matrix.os == 'ubuntu-latest'
        run: make BACKEND=torch test-unit-safetensors

      - name: Run typed index-op round-trip (torch, Ubuntu)
        # Verifies the typed targsort/tgather/tscatterAdd surface *resolves*
        # on torch (Compatible d I64) and runs — the C test covers numerics,
        # check-all is tape-only and can't resolve the I64 gate. Torch-only:
        # an integer-dtyped index tensor exists nowhere else.
        if: matrix.os == 'ubuntu-latest'
        run: make example-index-ops

      - name: Run integration tests
        # No SKIP_EXAMPLES: the mlx allocator aborts that used to skip
        # ntm-copy / ntm-associative-recall / dnc-recall / mountain-car-cont
        # are fixed by the generation-scoped free (see
        # docs/develop/tensor-lifecycle.md). The whole matrix runs.
        run: make test-e2e-examples EXAMPLE_TIMEOUT=900

      - name: Checkpoint resume smoke test
        # Trains gpt 10 epochs to a checkpoint dir, resumes to 20, and
        # asserts the sidecar epoch + resume log + completion. Gates the
        # Train.idr / Checkpoint.idr auto-save / resume integration.
        run: make test-integration-checkpoint-resume
      # <<< END GENERATED <<<

      - name: Upload Criterion JUnit XML artifacts
        # Always uploads, even on test failure, so the GitHub Actions UI
        # can render per-test results from the JUnit XML. Each Criterion
        # invocation writes build/test-criterion-<b>.xml; this collects
        # all three (per matrix lane: tape always, torch on ubuntu, mlx
        # on macOS).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-junit-${{ matrix.os }}
          path: build/test-criterion-*.xml
          if-no-files-found: warn

  # Coverage matrix — advisory only. Builds with
  # -fprofile-instr-generate -fcoverage-mapping, runs the test binaries,
  # merges the .profraw via llvm-profdata, emits HTML + text reports
  # under build-cov/html-<b>/. No CI gate; report-only. Gated to
  # workflow_dispatch (manual trigger via `gh workflow run`) because
  # coverage rebuilds with -O0 -g add ~5-10 min per backend lane and
  # the report is for local inspection rather than per-PR signal.
  coverage:
    name: coverage (${{ matrix.backend }} on ${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    needs: check-paired-defaults
    strategy:
      fail-fast: false
      matrix:
        include:
          - { backend: tape,  os: ubuntu-latest }
          - { backend: torch, os: ubuntu-latest }
          - { backend: mlx,   os: macos-latest  }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Chez Scheme + BLAS (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme build-essential libopenblas-dev llvm

      - name: Install Chez Scheme + LLVM (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install chezscheme coreutils llvm

      - name: Cache Idris 2
        id: idris2-cache
        uses: actions/cache@v4
        with:
          path: ~/.idris2
          key: idris2-v0.8.0-${{ matrix.os }}-v2

      - name: Build and install Idris 2
        if: steps.idris2-cache.outputs.cache-hit != 'true'
        run: |
          SCHEME="$(command -v scheme || command -v chez-scheme || command -v chezscheme || command -v chez || true)"
          git clone --branch v0.8.0 --depth 1 https://github.com/idris-lang/Idris2.git /tmp/Idris2
          cd /tmp/Idris2
          make bootstrap SCHEME="$SCHEME"
          make install

      - name: Add Idris 2 to PATH
        run: echo "$HOME/.idris2/bin" >> $GITHUB_PATH

      - name: Install backend-specific deps (mlx)
        if: matrix.backend == 'mlx'
        run: |
          python3 -m pip install --break-system-packages mlx
          MLX_SITE=$(python3 -c "
          import importlib.util, os, sys
          for name in ('mlx', 'mlx_metal'):
              spec = importlib.util.find_spec(name)
              if not spec: continue
              path = spec.submodule_search_locations[0] if spec.submodule_search_locations \
                  else os.path.dirname(spec.origin)
              if os.path.isdir(os.path.join(path, 'include')):
                  print(path); sys.exit(0)
          sys.exit(1)
          ")
          echo "MLX_SITE=$MLX_SITE" >> $GITHUB_ENV

      - name: Install backend-specific deps (torch)
        if: matrix.backend == 'torch'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          make ref-setup

      - name: Run coverage build
        # `make test-coverage-backend-<b>` recompiles the dylib + test binaries
        # with -fprofile-instr-generate -fcoverage-mapping, executes them
        # under LLVM_PROFILE_FILE, merges via llvm-profdata, and emits
        # the HTML report under build-cov/html-<b>/.
        run: make BACKEND=${{ matrix.backend }} test-coverage-backend

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.backend }}
          path: build-cov/html-${{ matrix.backend }}/
          if-no-files-found: warn
