name: test

# Detector-shaped CI: nothing here blocks a merge (development happens
# on the private mirror; publication pushes land directly on main and
# results are read after the fact, ~weekly). The structure is
# optimized for complete diagnosis per run, not cheap early rejection:
# jobs are independent (the only `needs:` edge is the real data
# dependency build -> test consumers), every generated gate step runs
# with !cancelled() so one red gate never hides its siblings, and
# fail-fast is off everywhere. Jobs are named after, and contain
# exactly, the make taxonomy layers (lint / test-unit /
# test-integration / test-e2e-* / coverage); the gate-coverage lint
# (scripts/check-ci-gate-coverage.py) enforces that mapping against
# the Makefile aggregators.
#
# The make-invocation step lists are generated from
# test.yml.spec.json by scripts/gen-ci-workflow.py (one marker-bounded
# region per job); only the scaffolding here is hand-written.

on:
  push:
    branches: [main]
  pull_request:
  # macOS runs on every push (the ~weekly publication cadence) — this
  # repo is public, so Actions minutes are free on macOS runners too
  # (the 10× multiplier only bills private repos), and the macOS lane
  # is the mlx backend's only CI coverage (all three backends are
  # first-class). pull_request stays Ubuntu-only to keep external-PR
  # queue time down; opt a PR into macOS via the Actions UI /
  # `gh workflow run test.yml -f include_macos=true`.
  workflow_dispatch:
    inputs:
      include_macos:
        description: 'Include macos-latest in the matrix'
        type: boolean
        default: false

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static gates that need no Idris/backend build: drift checks,
  # Python + C lint, the dep-light pyright surfaces, and the
  # CI-vs-spec / CI-vs-Makefile sync lints. Runs in parallel with
  # everything else (no `needs:` — a lint failure must not hide a
  # week's worth of matrix information).
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Verify paired Idris ↔ torch_ref defaults match
        # Catches drift between Idris example defaults and the paired
        # torch_ref/scripts/*.py argparse defaults.
        run: make test-integration-lint-paired-defaults
      - name: Verify rename headers are in sync with backend.h
        # Re-runs scripts/codegen/gen-rename-headers.py --check. Fails
        # if regenerating packages/backends/rename_<b>.h from backend.h
        # would change anything. Wired in by the gate-coverage lint —
        # CLAUDE.md documented this as a CI gate but no workflow ran it.
        run: make test-integration-lint-rename-headers
      - name: Verify Executor backend method sets are in sync
        # Catches the drift bug class: someone wires a new method into
        # Tape's instance block and silently forgets Torch / Mlx (or
        # vice-versa). Compile-only coverage misses this — the missing
        # backend stays unspellable until someone tries to use it.
        run: make check-executor-method-drift
      - name: Verify generated instance method blocks match manifest
        # Catches: someone hand-edits a marker-bounded GENERATED block
        # in Executor/{Tape,Torch,Mlx}.idr without updating MANIFEST,
        # or adds a MANIFEST entry without re-running gen-executor-instances.
        # Pairs with check-executor-method-drift: that catches drift
        # ACROSS backends; this catches drift between MANIFEST and the
        # rendered instance bodies.
        run: make check-executor-instances

      - name: Verify FFI wrap-on-return template invariants
        # Catches: (a) new Tensor-touching %foreign decls written as
        # %foreign "C:..." instead of scheme-wrapped, (b) hand-edited
        # scheme bodies missing the vector-ref unwrap or the wrap/retain
        # on T return. See docs/develop/tensor-lifecycle-plan.md.
        run: make test-integration-lint-ffi-wrap-template
      - name: Verify %foreign decls are correctly IO-typed
        # Catches the bug class fixed by the IO refactor (commits leading
        # up to e337512): side-effecting C calls bound to non-IO Idris
        # types, where `let _ =` bindings get DCE'd and `pure (...)`
        # fires the FFI before sequencing. Known dead surfaces are
        # skip-listed in the script.
        run: make test-integration-lint-non-io-side-effects
      - name: Verify CI workflow is in sync with its spec
        # Re-runs scripts/gen-ci-workflow.py --check. Fails if anyone
        # hand-edited a generated job block of this workflow without
        # updating .github/workflows/test.yml.spec.json. Spec is the
        # single source of truth; add a gate by appending to the spec
        # and regenerating, not by editing the workflow.
        run: make test-integration-lint-ci-workflow
      - name: Verify CI covers the make test taxonomy
        # Cross-checks every workflow's make invocations against the
        # Makefile: invoked targets must resolve (catches removed-target
        # landmines like test-unit-safetensors), and every aggregator
        # leaf of test-unit/test-integration/test-e2e/test-coverage must
        # run in some workflow or be a named exception / known hole in
        # the spec JSON.
        run: make test-integration-lint-ci-coverage
      # Distinct key from the build-bearing jobs' full venv
      # (pytorch-venv-*): this venv holds ONLY the dev group, and both
      # live at the same path — sharing a key would poison the
      # full-venv cache. uv sync below is idempotent on a warm venv.
      # Paired saves at the end of the job, if: always().
      - name: Restore lint venv cache
        uses: actions/cache/restore@v5
        with:
          path: packages/pytorch/.venv
          key: pytorch-venv-lint-${{ runner.os }}-${{ hashFiles('packages/pytorch/uv.lock') }}

      - name: Restore jupyter venv cache
        uses: actions/cache/restore@v5
        with:
          path: packages/jupyter/.venv
          key: jupyter-venv-${{ runner.os }}-${{ hashFiles('packages/jupyter/pyproject.toml') }}

      - name: Install uv + lint-only Python deps
        # `--only-group dev --no-install-project` installs ruff + vulture
        # + their transitive deps WITHOUT pulling in torch / transformers
        # / gymnasium / mlx (the main `[project]` deps). Cold-cache cost
        # ~5s; the torch-dependent gates live in the lint-full job
        # instead.
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          cd packages/pytorch && $HOME/.local/bin/uv sync --quiet --only-group dev --no-install-project
      - name: Lint Python surface (ruff + vulture)
        # Runs `make py-lint` which exercises ruff check + ruff format
        # --check + vulture (min-confidence 80% per pyproject.toml).
        # Use --no-sync so the partially-synced venv from the previous
        # step isn't filled with the heavy main deps.
        run: make lint-py
      - name: Typecheck stdlib Python scripts (pyright strict)
        # `make typecheck-py-scripts` — pyright strict over the
        # repo-root scripts/ tree (config root scripts/pyrightconfig
        # .json). Lives in this job because the tree is stdlib-only:
        # pyright is already in the --only-group dev venv and no
        # torch/transformers imports are involved. The torch-dependent
        # typecheck gates (typecheck-py-pytorch / -transformers /
        # -examples) run in the lint-full job instead.
        run: make typecheck-py-scripts
      - name: Typecheck Jupyter kernel package (pyright strict)
        # `make typecheck-py-jupyter` — pyright strict over
        # packages/jupyter (config root: its pyproject.toml
        # [tool.pyright], venvPath pointed at the package's own pip
        # venv for ipykernel/jupyter_client/pexpect resolution). The
        # target builds that venv from scratch here (~30-40s: python3
        # -m venv + pip install -e .[dev]) — deliberately NOT
        # jupyter-install, which dep-chains the heavy backend build.
        # No torch involved, so it fits this job.
        run: make typecheck-py-jupyter
      - name: Run jupyter cell-parser unit tests
        # pytest over the kernel's cell parser (no REPL, no backend —
        # reuses the jupyter venv built by the typecheck step above).
        # Wired in by the gate-coverage lint.
        run: make test-integration-jupyter-cellparser
      - name: Install C-lint tools (clang-format + cppcheck + clang-tidy)
        # apt-installs clang-format + cppcheck + clang-tidy on the
        # Ubuntu runner. ~10s on a warm cache. Local devs install via
        # `brew install clang-format cppcheck llvm` or the equivalent
        # nix derivation. The Make target gracefully skips each tool
        # that isn't on PATH so it doesn't block pre-commit runs
        # locally. libopenblas-dev provides <cblas.h>, which clang-tidy
        # needs to parse the tape sources' non-Apple BLAS branch.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-format cppcheck clang-tidy libopenblas-dev
      - name: Lint C / C++ backend surface (clang-format + cppcheck + clang-tidy)
        # Runs `make lint-c`: clang-format --dry-run + cppcheck on
        # all 3 backends + clang-tidy on tape (tape uses only libc
        # + BLAS headers; no libtorch / mlx setup needed here). Full
        # clang-tidy across the torch C++ backend runs in the
        # lint-full job, which carries libtorch via the uv venv.
        # clang-format rules live in `.clang-format`; cppcheck flags
        # inline; clang-tidy check set in `.clang-tidy`.
        run: make lint-c
      - name: Lint C misc-include-cleaner gate (rename-free)
        # Runs `make lint-c-include-cleaner` — clang-tidy with ONLY
        # misc-include-cleaner enabled and WITHOUT `-include
        # rename_tape.h`. The rename macros would otherwise hide every
        # backend.h-declared symbol from include-cleaner's provider
        # tracker (~250 architectural FPs). Cannot enable the check
        # in the default `.clang-tidy` for that reason; this is the
        # canonical gate for include hygiene on backend_tape.
        run: make lint-c-include-cleaner

      - name: Save lint venv cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: packages/pytorch/.venv
          key: pytorch-venv-lint-${{ runner.os }}-${{ hashFiles('packages/pytorch/uv.lock') }}

      - name: Save jupyter venv cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: packages/jupyter/.venv
          key: jupyter-venv-${{ runner.os }}-${{ hashFiles('packages/jupyter/pyproject.toml') }}

  # Lint/typecheck gates that need the full torch venv (pyright import
  # resolution over torch/transformers-importing scripts). No Idris
  # build involved — the only heavy dependency is ref-setup.
  lint-full:
    name: lint-full
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Restore pytorch venv cache
        uses: actions/cache/restore@v5
        with:
          path: packages/pytorch/.venv
          key: pytorch-venv-${{ runner.os }}-${{ hashFiles('packages/pytorch/uv.lock') }}

      - name: Install torch + transformers via uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          make ref-setup

      - name: Install clang-tidy + BLAS headers (for the torch C++ lint)
        # clang-tidy for the C_LINT_FULL_CLANG_TIDY lane below;
        # libopenblas-dev so shared sources' non-Apple BLAS branch parses.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-tidy libopenblas-dev

      # >>> GENERATED (lint-full) FROM test.yml.spec.json >>>
      - name: Typecheck torch_ref (pyright)
        # Alias of ref-typecheck: pyright over packages/pytorch/torch_ref/
        # at the typeCheckingMode pinned in its pyproject.toml. Lives in
        # this venv-bearing lint job (not the dep-free `lint` job) because
        # import resolution needs the full uv venv from ref-setup.
        # Pyright version is pinned by uv.lock.
        if: ${{ !cancelled() }}
        run: make typecheck-py-pytorch

      - name: Typecheck idris-ml-examples Python helpers (pyright strict)
        # pyright strict over packages/idris-ml-examples/scripts/ (config
        # root: its pyrightconfig.json, selected via -p). verify_dtypes.py
        # imports torch/safetensors, which only the full ref-setup venv
        # carries.
        if: ${{ !cancelled() }}
        run: make typecheck-py-examples

      - name: Typecheck idris-transformers scripts (pyright strict)
        # pyright strict over packages/idris-transformers/scripts/ (config
        # root: its pyrightconfig.json via -p). The oracle/compare scripts
        # import torch/transformers/safetensors, which only the full
        # ref-setup venv carries.
        if: ${{ !cancelled() }}
        run: make typecheck-py-transformers

      - name: Full clang-tidy over torch C++ backend (advisory)
        # The default `lint-c` runs clang-tidy on tape only; the torch
        # C++ sources need libtorch headers, which this job carries for
        # free via the ref-setup venv (the Makefile's LIBTORCH_PATH
        # detection finds the venv's torch). Closes the long-deferred
        # "full clang-tidy needs libtorch staged" follow-up. Advisory
        # until the first run's findings are triaged — the torch C++
        # tree has never been clang-tidy'd and can't be linted locally
        # (macOS+nix clang-tidy rejects Apple SDK headers); promote by
        # dropping continue-on-error once clean.
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: make C_LINT_FULL_CLANG_TIDY=1 lint-c-torch
      # <<< END GENERATED (lint-full) <<<

      - name: Save pytorch venv cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: packages/pytorch/.venv
          key: pytorch-venv-${{ runner.os }}-${{ hashFiles('packages/pytorch/uv.lock') }}

  # The one real data dependency: build the toolchain + library trees
  # once per OS and save them to the per-sha TTC cache that the
  # test-unit / test-integration / test-e2e-* jobs restore. Ubuntu
  # additionally pre-elaborates the torch tree (the first-ever torch
  # elaboration of library + transformers + a 2B-param example in one
  # cascade OOM-killed run 27364532457; elaborating the library here,
  # with swap, leaves downstream jobs only example-level work).
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.include_macos)) && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      # Full history (fetch-depth 0): the composite's git-restore-mtime
      # needs per-file last-commit dates; a shallow clone would stamp
      # every file with the HEAD commit's time and defeat the TTC cache.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-idris-ml
        id: setup
        with:
          os-label: ${{ matrix.os }}
          backend-deps: ${{ matrix.os == 'ubuntu-latest' && 'torch' || 'mlx' }}
          ttc-job: build
          swap: 'true'

      - name: Build tape backend + install libraries
        run: make BACKEND=tape backend && make install

      - name: Build torch backend + pre-elaborate torch tree (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: make BACKEND=torch install

      - name: Build mlx backend + pre-elaborate mlx tree (macOS)
        if: matrix.os == 'macos-latest'
        run: make BACKEND=mlx install

      - name: Save caches
        if: always()
        uses: ./.github/actions/save-idris-ml-caches
        with:
          os-label: ${{ matrix.os }}
          idris2-cache-hit: ${{ steps.setup.outputs.idris2-cache-hit }}
          ttc-job: build
          save-pytorch-venv: ${{ matrix.os == 'ubuntu-latest' }}

  # Unit layer: the `make test-unit` aggregator's leaves,
  # per-backend-conditioned (tape everywhere; torch on Ubuntu; mlx +
  # the multi-backend suite on macOS). pack drives the Idris-side
  # suites, hence with-pack.
  test-unit:
    name: test-unit (${{ matrix.os }})
    needs: build
    # needs is matrix-wide: one failed build leg skips this job on EVERY
    # os (observed 2026-06-11, run 27370628186 — the macOS setup failure
    # masked all ubuntu test signal). !cancelled() keeps the job running
    # on legs whose build succeeded; a leg whose build failed runs
    # cold-or-red, which is attributable noise, not masking.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.include_macos)) && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-idris-ml
        id: setup
        with:
          os-label: ${{ matrix.os }}
          backend-deps: ${{ matrix.os == 'ubuntu-latest' && 'torch' || 'mlx' }}
          with-pack: 'true'
          ttc-job: test-unit
          swap: 'true'

      - name: Install clang-tidy (macOS, for the advisory mlx lint)
        # brew llvm is keg-only; expose its bin dir for the
        # C_LINT_FULL_CLANG_TIDY mlx step in the generated block.
        if: matrix.os == 'macos-latest'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      # >>> GENERATED (test-unit) FROM test.yml.spec.json >>>
      - name: Run Criterion suite (tape)
        if: ${{ !cancelled() }}
        run: make BACKEND=tape test-unit-c

      - name: Run Criterion suite (torch, Ubuntu)
        if: ${{ matrix.os == 'ubuntu-latest' && !cancelled() }}
        run: make BACKEND=torch test-unit-c

      - name: Run Criterion suite (mlx, macOS)
        if: ${{ matrix.os == 'macos-latest' && !cancelled() }}
        run: make BACKEND=mlx test-unit-c

      - name: Run idris-gym unit suite
        # Pure-Idris suite for the gym package (spaces, RNG, classic-control
        # + toy-text envs, wrappers) via the pack-built test harness. Wired
        # in by the gate-coverage lint — it was the only test-unit leaf
        # running in no workflow.
        if: ${{ !cancelled() }}
        run: make test-unit-gym

      - name: Run idris-args unit suite
        # Pure-Idris suite for the zero-dep CLI flag parsing package
        # (packages/idris-args/): readers, --flag/=-form values, switches,
        # positionals, unknown-flag/bad-value errors, --help rendering.
        if: ${{ !cancelled() }}
        run: make test-unit-args

      - name: Run idris-transformers unit tests
        # Pure-Idris test harness for the HF-aligned model package
        # (packages/idris-transformers/): bertParamNames catalogue + an FFI
        # suite that constructs a real HfBert and asserts the C-side param
        # registry matches the catalogue.
        if: ${{ !cancelled() }}
        run: make test-unit-idris-transformers

      - name: Run examples unit suite (tape)
        # Idris-side suite living in packages/idris-ml-examples (Test.Reinforce,
        # Test.Generate). Wired in to catch drift like the IO-lift mismatch on
        # rolloutEpBatched and the bitlinear-test scale formula — both pre-existed
        # in tree because the target was not previously gated by CI.
        if: ${{ !cancelled() }}
        run: make BACKEND=tape test-unit-examples

      - name: Run examples unit suite (torch, Ubuntu)
        if: ${{ matrix.os == 'ubuntu-latest' && !cancelled() }}
        run: make BACKEND=torch test-unit-examples

      - name: Run examples unit suite (mlx, macOS)
        if: ${{ matrix.os == 'macos-latest' && !cancelled() }}
        run: make BACKEND=mlx test-unit-examples

      - name: Run Idris unit suite (tape)
        # Idris-side smart-constructor / LayerLike / Tensor-lifecycle suite
        # against the tape primary. The test buckets that touch the C
        # surface (GradMode, ManagedHandle) use `{d=TestExecutor}` which the
        # Makefile-generated `TestConfig.idr` resolves to TapeExecutor here, so
        # FFI calls land on tape-suffixed C symbols.
        if: ${{ !cancelled() }}
        run: make BACKEND=tape test-unit-idris-ml

      - name: Run Idris unit suite (torch, Ubuntu)
        # Same suite as the tape lane but with TestExecutor = TorchExecutor TCpu.
        # Catches Idris-side regressions that a tape-only run would miss
        # (broken torch Scheme wrapper, drift in `UserExecutorTransfer`
        # instances, etc.).
        if: ${{ matrix.os == 'ubuntu-latest' && !cancelled() }}
        run: make BACKEND=torch test-unit-idris-ml

      - name: Run Idris unit suite (mlx, macOS)
        # Same suite as tape/torch but with TestExecutor = MlxExecutor MCpu.
        # Catches mlx Scheme-wrapper drift, lazy-eval / handle-lifetime
        # regressions in the test-managed-handle suite under Metal.
        if: ${{ matrix.os == 'macos-latest' && !cancelled() }}
        run: make BACKEND=mlx test-unit-idris-ml

      - name: Run multi-backend Idris suite (macOS)
        # Adds Test.Transfer (cross-backend `toExecutor` smoke) +
        # Test.MultiExecutorRegistry (registry isolation invariant) on
        # top of the per-backend buckets. Forces BACKEND=torch,tape,mlx
        # so all three sets of C symbols are linked — only feasible on
        # the macOS lane (Ubuntu has no mlx).
        if: ${{ matrix.os == 'macos-latest' && !cancelled() }}
        run: make test-unit-multi-backend

      - name: Full clang-tidy over mlx C++ backend (macOS, advisory)
        # The default `lint-c` runs clang-tidy on tape only; the mlx C++
        # sources need the MLX headers, which only this macOS lane stages
        # (MLX_SITE from the composite). brew's clang-tidy is installed by
        # the scaffolding step above. Advisory: the mlx tree has never
        # been clang-tidy'd, and the Apple-SDK-vs-llvm pre-include skew
        # that blocks nix clang-tidy locally may produce FPs here too —
        # promote by dropping continue-on-error once a run comes back
        # clean.
        if: ${{ matrix.os == 'macos-latest' && !cancelled() }}
        continue-on-error: true
        run: make C_LINT_FULL_CLANG_TIDY=1 lint-c-mlx

      - name: Run Criterion suite under ASan + UBSan (tape, Ubuntu)
        # AddressSanitizer + UndefinedBehaviorSanitizer pass over the
        # C tape backend + Criterion suite. The Makefile target sets
        # EXTRA_CFLAGS='-fsanitize=address,undefined ...' on top of the
        # stock -O2 build and lands the artifacts in a distinct
        # `build/<key>-asan/` tree (via the ASAN axis in BUILD_KEY)
        # so the warm tree stays clean.
        #
        # First runs may surface latent UB sites — `continue-on-error:
        # true` keeps this advisory until the first cleanup commits
        # land; promote to hard-fail by dropping that line. mlx + torch
        # lanes are deferred (mlx-Metal + asan interactions are messy;
        # libtorch + asan is supported but slow to set up).
        #
        # Ubuntu-only because asan on macOS requires a separate
        # instrumented runtime and clang invocation.
        if: ${{ matrix.os == 'ubuntu-latest' && !cancelled() }}
        continue-on-error: true
        run: make test-unit-c-asan-tape
      # <<< END GENERATED (test-unit) <<<

      - name: Save caches
        if: always()
        uses: ./.github/actions/save-idris-ml-caches
        with:
          os-label: ${{ matrix.os }}
          idris2-cache-hit: ${{ steps.setup.outputs.idris2-cache-hit }}
          save-pack: 'true'
          ttc-job: test-unit

      - name: Upload Criterion JUnit XML artifacts
        # Always uploads, even on test failure, so the GitHub Actions UI
        # can render per-test results from the JUnit XML. Each Criterion
        # invocation writes build/test-criterion-<b>.xml; this collects
        # all per-lane files (tape always, torch on ubuntu, mlx on macos).
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: criterion-junit-${{ matrix.os }}
          path: build/test-criterion-*.xml
          if-no-files-found: warn

  # Integration layer: negative type-gates, the typed index-op probe,
  # the checkpoint-resume loop, the coverage gap probe, and (until the
  # bench workflow absorbs them) the Tier-1 perf benches + their sync
  # lints.
  test-integration:
    name: test-integration (${{ matrix.os }})
    needs: build
    # needs is matrix-wide: one failed build leg skips this job on EVERY
    # os (observed 2026-06-11, run 27370628186 — the macOS setup failure
    # masked all ubuntu test signal). !cancelled() keeps the job running
    # on legs whose build succeeded; a leg whose build failed runs
    # cold-or-red, which is attributable noise, not masking.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.include_macos)) && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-idris-ml
        id: setup
        with:
          os-label: ${{ matrix.os }}
          backend-deps: ${{ matrix.os == 'ubuntu-latest' && 'torch' || 'none' }}
          ttc-job: test-integration
          swap: 'true'

      # >>> GENERATED (test-integration) FROM test.yml.spec.json >>>
      - name: Verify GradMode gate (NoGrad loss rejected at compile)
        # Asserts the type-level gate `nativeTrainStep : ... -> Tensor [] d
        # WithGrad -> Double` still rejects a `NoGrad` loss. If this step
        # ever passes the negative test (i.e. the gate compiles a NoGrad
        # loss), the "inference loss silently no-ops training" bug class
        # has regressed.
        if: ${{ !cancelled() }}
        run: make test-integration-typegate-gradmode

      - name: Verify GradMode aliasing rejection (linear freezeNetwork)
        # Asserts that linear `freezeNetwork` consumes its input — using
        # the pre-freeze Network reference afterwards must be a compile
        # error. Prevents the "freeze net, train via original variable
        # which silently no-ops" footgun.
        if: ${{ !cancelled() }}
        run: make test-integration-typegate-gradmode-aliasing

      - name: Verify cross-family lossless-cast gate (DType.Core.LosslessTo)
        # Asserts LosslessTo refuses a mantissa-shrinking direction
        # (F32 to BF16). Prevents silent precision-losing mid-graph
        # casts. Pairs with the positive Test.Lossless suite.
        if: ${{ !cancelled() }}
        run: make test-integration-typegate-lossy-cast

      - name: Verify int-overflow lossless-cast gate (#412 F1)
        # Asserts LosslessTo refuses I64 to F32 (max int value far
        # exceeds F32 mantissa exact-integer ceiling). Pairs with the
        # I32 to F64 + U8 to F32 positive cases in Test.Lossless.
        if: ${{ !cancelled() }}
        run: make test-integration-typegate-int-overflow-cast

      - name: Type-check HfLlamaInference example
        # `idris2 --check` over Example/HfLlamaInference.idr — the example
        # is too heavy to *run* outside the dedicated roundtrip gates, but
        # type-drift against the library surface is cheap to catch here.
        # Wired in by the gate-coverage lint.
        if: ${{ !cancelled() }}
        run: make test-integration-lint-hf-llama-inference

      - name: Run typed index-op round-trip (torch, Ubuntu)
        # Verifies the typed targsort/tgather/tscatterAdd surface *resolves*
        # on torch (Compatible d I64) and runs — the C test covers numerics,
        # check-all is tape-only and can't resolve the I64 gate. Torch-only:
        # an integer-dtyped index tensor exists nowhere else.
        if: ${{ matrix.os == 'ubuntu-latest' && !cancelled() }}
        run: make example-index-ops

      - name: Run coverage gap probe (advisory)
        # Static probe: parses OP_* enums from backend_<b>/tape.h and
        # extern "C" decls from backend.h, cross-references against
        # test/. Writes CSVs to build/coverage-gap-{ops,symbols}.csv.
        # Exit code is advisory today (0 even on gaps); coverage-policy.md
        # flips this to gating once W3+W4 close. See
        # docs/develop/coverage-policy.md for the three-axis target.
        if: ${{ !cancelled() }}
        run: make test-coverage-gap-probe

      - name: Checkpoint resume smoke test
        # Trains gpt 10 epochs to a checkpoint dir, resumes to 20, and
        # asserts the sidecar epoch + resume log + completion. Gates the
        # Train.idr / Checkpoint.idr auto-save / resume integration.
        if: ${{ !cancelled() }}
        run: make test-integration-checkpoint-resume
      # <<< END GENERATED (test-integration) <<<

      - name: Save caches
        if: always()
        uses: ./.github/actions/save-idris-ml-caches
        with:
          os-label: ${{ matrix.os }}
          idris2-cache-hit: ${{ steps.setup.outputs.idris2-cache-hit }}
          ttc-job: test-integration

  # E2E example smoke matrix: every example across this runner's
  # backend lanes at few-epoch thresholds.
  test-e2e-examples:
    name: test-e2e-examples (${{ matrix.os }})
    needs: build
    # needs is matrix-wide: one failed build leg skips this job on EVERY
    # os (observed 2026-06-11, run 27370628186 — the macOS setup failure
    # masked all ubuntu test signal). !cancelled() keeps the job running
    # on legs whose build succeeded; a leg whose build failed runs
    # cold-or-red, which is attributable noise, not masking.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.include_macos)) && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-idris-ml
        id: setup
        with:
          os-label: ${{ matrix.os }}
          backend-deps: ${{ matrix.os == 'ubuntu-latest' && 'torch' || 'mlx' }}
          ttc-job: test-e2e-examples
          swap: 'true'

      # >>> GENERATED (test-e2e-examples) FROM test.yml.spec.json >>>
      - name: Run example smoke matrix
        # Every example across the backend lanes available on this runner
        # (tape + torch on Ubuntu; tape + mlx on macOS), few-epoch smoke
        # thresholds. No SKIP_EXAMPLES: the mlx allocator aborts that used
        # to skip ntm-copy / ntm-associative-recall / dnc-recall /
        # mountain-car-cont are fixed by the generation-scoped free (see
        # docs/develop/tensor-lifecycle.md).
        if: ${{ !cancelled() }}
        run: make test-e2e-examples EXAMPLE_TIMEOUT=900
      # <<< END GENERATED (test-e2e-examples) <<<

      - name: Save caches
        if: always()
        uses: ./.github/actions/save-idris-ml-caches
        with:
          os-label: ${{ matrix.os }}
          idris2-cache-hit: ${{ steps.setup.outputs.idris2-cache-hit }}
          ttc-job: test-e2e-examples

  # E2E HF cross-language gates: the PyTorch reference correctness
  # suite, the oracle generators, and the Idris-vs-HF roundtrips in
  # ascending cost (bert -> gpt2 -> bitnet -> llama -> llama-generate).
  # Isolated in its own job for resource headroom: multi-GB model
  # downloads (own HF cache) and elaboration peaks near the 16 GB
  # runner ceiling (own swapfile, no accumulated state from other
  # suites). Ubuntu-only: the torch venv lane carries it.
  test-e2e-hf:
    name: test-e2e-hf
    needs: build
    # See the test-unit comment: don't let a failed build leg on another
    # os mask this job's signal.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-idris-ml
        id: setup
        with:
          os-label: ubuntu-latest
          backend-deps: torch
          restore-hf-models: 'true'
          ttc-job: test-e2e-hf
          swap: 'true'

      # >>> GENERATED (test-e2e-hf) FROM test.yml.spec.json >>>
      - name: Run PyTorch reference correctness suite
        # pytest over packages/pytorch/torch_ref/correctness/ — the
        # PyTorch side is the correctness oracle for every paired example,
        # so its own suite gates first. Wired in by the gate-coverage
        # lint — it ran in no workflow despite being the oracle.
        if: ${{ !cancelled() }}
        run: make test-e2e-pytorch-ref

      - name: Run RoPE table oracle
        # Generates the Llama-3 RoPE table oracle (inv_freq + cos/sin
        # slice) consumed by the Idris-side RoPE tests.
        if: ${{ !cancelled() }}
        run: make test-e2e-rope-oracle

      - name: Run HfBert oracle generator + pytest
        # Drives packages/idris-transformers/scripts/save_oracle.py through
        # pytest under the pytorch uv venv (carries the transformers dep).
        # Downloads google/bert_uncased_L-2_H-128_A-2 from HF Hub, runs
        # forward on the fixed input, asserts the resulting oracle is
        # shape [128] F32 finite + non-trivial.
        if: ${{ !cancelled() }}
        run: make test-e2e-transformers-oracle-bert

      - name: Run HfGpt2 oracle generator + pytest
        # Same shape as the HfBert oracle gate but for sshleifer/tiny-gpt2.
        # Downloads the checkpoint, runs forward on [15496, 995], asserts
        # the last-position hidden state is shape [2] (sshleifer/tiny-gpt2
        # is intentionally degenerate at hidden=2 — exercises the
        # architectural pieces without burning CI disk).
        if: ${{ !cancelled() }}
        run: make test-e2e-transformers-oracle-gpt2

      - name: Run HfLlama oracle generator + pytest
        # Oracle-generation pytest for unsloth/Llama-3.2-1B. Wired in by
        # the gate-coverage lint (the roundtrip regenerates the oracle
        # anyway, but this gate asserts the generator script's own
        # invariants and fails earlier + cheaper).
        if: ${{ !cancelled() }}
        run: make test-e2e-transformers-oracle-llama

      - name: Run HfLlama generation oracle pytest
        # Greedy-decode oracle pytest paired with the llama-generate
        # roundtrip below. Wired in by the gate-coverage lint.
        if: ${{ !cancelled() }}
        run: make test-e2e-transformers-oracle-llama-generate

      - name: Run HfBert end-to-end roundtrip
        # The cross-language correctness gate: regenerates the Python
        # oracle, runs the Idris HfBertInference example (loading the
        # real Google bert-tiny weights via the HF-aligned HfBert
        # module), and asserts elementwise agreement within
        # max-abs-diff 1e-3 on the 128-dim pooled [CLS] output.
        # Currently passes at 4.1e-4 locally on tape.
        if: ${{ !cancelled() }}
        run: make test-e2e-hf-bert-roundtrip

      - name: Run HfGpt2 end-to-end roundtrip
        # Same gate shape as HfBert but for GPT-2: regenerate the Python
        # oracle from hf-internal-testing/tiny-random-gpt2, run the Idris
        # HfGpt2Inference binary, assert the 32-dim last-position hidden
        # state matches within max-abs-diff 1e-3. Currently passes at
        # ~1e-6 locally on tape.
        if: ${{ !cancelled() }}
        run: make test-e2e-hf-gpt2-roundtrip

      - name: Run HfBitNet end-to-end roundtrip (torch)
        # Cross-language gate: regenerate the Python oracle from
        # microsoft/bitnet-b1.58-2B-4T, run the Idris HfBitNetInference
        # binary --dump-logits, assert argmax on the vocab-128256 logit
        # row matches the HF oracle at max-abs-diff 1.0. BACKEND=torch
        # because tape F64 on a ~2B-param model OOMs the 14 GB Ubuntu
        # runner (see Low-priority TODO "Tape F64 large-LM OOM"). BitNet
        # is not license-gated, so no HF_TOKEN handling needed. The
        # job-level swapfile absorbs the cold-tree elaboration peak that
        # OOM-killed run 27364532457.
        if: ${{ !cancelled() }}
        run: make BACKEND=torch test-e2e-hf-bitnet-roundtrip

      - name: Run HfLlama end-to-end roundtrip (torch)
        # Cross-language gate for Llama 3.2 1B. Regenerates the Python
        # oracle from unsloth/Llama-3.2-1B (public mirror of Meta's
        # weights, no license-gate / no HF_TOKEN), runs the Idris
        # HfLlamaInference binary --dump-final-hidden, asserts the
        # 2048-dim last-position hidden state matches the oracle within
        # max-abs-diff 1.0. Currently passes at 4.96e-05 on torch-mps
        # and 1.20e-04 on mlx-gpu in local dev runs; the CI torch-cpu
        # lane carries the same Idris-side numerics through libtorch CPU.
        # BACKEND=torch because tape F64 doesn't fit (~10 GB params +
        # arena vs ~14 GB runner RAM); see Low-priority TODO "Tape F64
        # large-LM OOM".
        if: ${{ !cancelled() }}
        run: make BACKEND=torch test-e2e-hf-llama-roundtrip

      - name: Run HfLlama multi-step generation roundtrip (torch)
        # Cross-language gate for Llama 3.2 1B's *generation* path.
        # The companion single-forward gate above tests one fixed token;
        # this step exercises the full greedy-decode loop: tokenize "The
        # capital of France is", generate 4 tokens via `genLoop` (no KV
        # cache yet — bumps to 8+ once KV cache lands), assert the
        # resulting token-ID sequence matches HF `model.generate(
        # do_sample=False, use_cache=True)` element-wise. Catches drift
        # in tokenization, every layer of the forward, argmax, and the
        # per-step glue that the single-forward gate can't see.
        if: ${{ !cancelled() }}
        run: make BACKEND=torch test-e2e-hf-llama-generate-roundtrip
      # <<< END GENERATED (test-e2e-hf) <<<

      - name: Save caches
        if: always()
        uses: ./.github/actions/save-idris-ml-caches
        with:
          os-label: ubuntu-latest
          idris2-cache-hit: ${{ steps.setup.outputs.idris2-cache-hit }}
          save-hf-models: 'true'
          ttc-job: test-e2e-hf

  # Coverage matrix — report-only (no gate; artifacts for local
  # inspection). Builds with -fprofile-instr-generate
  # -fcoverage-mapping, runs the test binaries, merges the .profraw
  # via llvm-profdata, emits HTML + text reports under
  # build-cov/html-<b>/. Runs on push (minutes are free and a
  # coverage-build failure — different flags — is itself signal) and
  # on dispatch; skipped for external PRs to keep their queue time
  # down.
  coverage:
    name: coverage (${{ matrix.backend }} on ${{ matrix.os }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { backend: tape,  os: ubuntu-latest }
          - { backend: torch, os: ubuntu-latest }
          - { backend: mlx,   os: macos-latest  }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-idris-ml
        id: setup
        with:
          os-label: ${{ matrix.os }}
          backend-deps: ${{ matrix.backend == 'tape' && 'none' || matrix.backend }}
          restore-ttc: 'false'
          swap: 'true'

      - name: Install LLVM (Ubuntu)
        # llvm ships the unversioned llvm-profdata/llvm-cov the make
        # recipe calls; clang (usually preinstalled, kept explicit) is
        # the only compiler that accepts -fprofile-instr-generate —
        # mk/tests.mk forces it via COV_CC_OVERRIDES on Linux.
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y llvm clang

      - name: Install LLVM (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install llvm

      - name: Run coverage build
        # `make test-coverage-backend` recompiles the dylib + test
        # binaries with -fprofile-instr-generate -fcoverage-mapping,
        # executes them under LLVM_PROFILE_FILE, merges via
        # llvm-profdata, and emits the HTML report under
        # build-cov/html-<b>/.
        run: make BACKEND=${{ matrix.backend }} test-coverage-backend

      - name: Save caches
        if: always()
        uses: ./.github/actions/save-idris-ml-caches
        with:
          os-label: ${{ matrix.os }}
          idris2-cache-hit: ${{ steps.setup.outputs.idris2-cache-hit }}
          save-ttc: 'false'

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-html-${{ matrix.backend }}
          path: build-cov/html-${{ matrix.backend }}/
          if-no-files-found: warn
