name: perf

# Tier 1 + Tier 2 perf cadence (see docs/develop/testing-taxonomy.md).
# Runs the `bench-deep` aggregator end-to-end on Ubuntu (bench-deep ⊇
# bench-fast, so this workflow is the single per-push perf measurement
# — running Tier 1 separately in test.yml double-appended Axis A/B
# JSONL entries for the same sha) and uploads the refreshed
# perf-log.jsonl + BENCHMARKS.md as artifacts. Covers Axes A (op
# kernels), B (single-layer fwd+bwd), C (e2e training), and the BERT +
# GPT-2 cells of Axis D (HF inference). The Llama-generate cell of
# Axis D needs torch-mps F32 (Apple Silicon) — it's not available on
# this Ubuntu runner so it lands on a developer's local perf-deep.sh
# run, not this CI workflow.
#
# The perf-log sync lints run here, where the data is produced:
# test-integration-lint-benchmarks (BENCHMARKS.md ↔ JSONL) and the
# enforcing perf-regression gates (op_bench + run, both fail the job
# on a regression once a cell has enough history).
#
# Trigger is push-to-main, not a nightly cron: day-to-day work happens
# on the private mirror (CI disabled) and this public repo only moves
# when a reviewed publication push lands (~weekly). A cron would
# re-measure identical code daily; one snapshot per publication push
# is the natural perf-regression granularity. `workflow_dispatch`
# stays for ad-hoc runs from the Actions UI.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skip the 40-min bench-deep on a docs-only push: docs can't move
  # perf, and a pointless run only burns a runner + exposes the perf
  # path to transient pack-clone flakes. Mirrors test.yml's `changes`
  # job (same pinned paths-filter). The `code` filter adds BENCHMARKS.md
  # + perf-log.jsonl on top of test.yml's globs because the sync check
  # (test-integration-lint-benchmarks) runs ONLY here — a hand-edit to
  # either artifact must still trigger it.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            code:
              - 'packages/**'
              - 'mk/**'
              - 'scripts/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'Makefile'
              - 'pack.toml'
              - '.github/**'
              - 'BENCHMARKS.md'
              - 'docs/develop/perf-log.jsonl'

  bench-deep:
    name: bench-deep (tape)
    needs: changes
    # Run on any code change; always on a manual dispatch. paths-filter
    # leaves `code` empty on an ambiguous base (first/force push) → the
    # `!= 'false'` test fails safe = run, matching test.yml's bias.
    if: ${{ (needs.changes.outputs.code != 'false' || github.event_name == 'workflow_dispatch') && !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: "nix develop .#default --command bash -e {0}"
    # bench-deep itself is ≤20 min warm, but a cold runner pays the
    # idris2 bootstrap + `make install` elaboration + the Axis C/D
    # example builds from scratch.
    timeout-minutes: 60
    steps:
      # Full history: the composite's git-restore-mtime needs per-file
      # last-commit dates for the TTC-cache reuse.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Toolchain from the repo flake; make steps run inside it via this job's
      # defaults.run.shell.
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # torch deps: every Python invocation in the bench path goes
      # through `uv run` inside packages/pytorch (bench-ops-py /
      # bench-layers-py, the Axis C/D PyTorch refs, and the Idris-side
      # hf_tokenize subprocess). No pack: the bench path doesn't drive
      # the pack-built test harnesses.
      - uses: ./.github/actions/setup-idris-ml
        id: setup
        with:
          os-label: ubuntu-latest
          backend-deps: torch
          ttc-job: bench-deep
          swap: 'true'

      - name: Build tape backend
        run: env BACKEND=tape make backend

      - name: Run bench-deep
        run: make bench-deep

      - name: Verify BENCHMARKS.md is in sync with perf-log.jsonl
        # Catches a hand-edit of BENCHMARKS.md that drifts from the
        # JSONL truth. Runs here (not test.yml) because this workflow
        # produces the entries it checks.
        if: ${{ !cancelled() }}
        run: make test-integration-lint-benchmarks

      - name: Run perf-regression gate (kind="op_bench", enforcing)
        # op_bench mode always gates (check-perf-regression.py
        # always_gates=True): a FAIL exits non-zero regardless of
        # PERF_GATE. Cells with < 6 samples are INSUFFICIENT-HISTORY
        # and can't FAIL, so it stays green until per-cell history fills.
        if: ${{ !cancelled() }}
        run: make test-integration-lint-perf-regression

      - name: Run perf-regression gate (kind="run" entries, enforcing)
        # Groups perf-log.jsonl `kind="run"` entries by (example,
        # backend, args), medians the last 10, and reports OK / WARN
        # (>15%) / FAIL (>100% = 2× slower) for the latest entry per
        # cell. PERF_GATE=1 makes a FAIL fail the job. Safe to enforce:
        # cells with < 11 samples are INSUFFICIENT-HISTORY and can't
        # FAIL, so the gate self-activates per-cell as history accrues.
        if: ${{ !cancelled() }}
        env:
          PERF_GATE: "1"
        run: make lint-perf-run

      - name: Save caches
        if: always()
        uses: ./.github/actions/save-idris-ml-caches
        with:
          os-label: ubuntu-latest
          ttc-job: bench-deep

      - name: Upload perf-log.jsonl
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: perf-log
          path: docs/develop/perf-log.jsonl

      - name: Upload BENCHMARKS.md
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: benchmarks-md
          path: BENCHMARKS.md
