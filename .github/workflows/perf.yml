name: perf

# Tier 1 + Tier 2 perf cadence (see docs/develop/testing-taxonomy.md).
# Runs the `bench-deep` aggregator end-to-end on Ubuntu (bench-deep ⊇
# bench-fast, so this workflow is the single per-push perf measurement
# — running Tier 1 separately in test.yml double-appended Axis A/B
# JSONL entries for the same sha) and uploads the refreshed
# perf-log.jsonl + BENCHMARKS.md as artifacts. Covers Axes A (op
# kernels), B (single-layer fwd+bwd), C (e2e training), and the BERT +
# GPT-2 cells of Axis D (HF inference). The Llama-generate cell of
# Axis D needs torch-mps F32 (Apple Silicon) — it's not available on
# this Ubuntu runner so it lands on a developer's local perf-deep.sh
# run, not this CI workflow.
#
# The perf-log sync lints run here, where the data is produced:
# test-integration-lint-benchmarks (BENCHMARKS.md ↔ JSONL) and the
# advisory perf-regression reports.
#
# Trigger is push-to-main, not a nightly cron: day-to-day work happens
# on the private mirror (CI disabled) and this public repo only moves
# when a reviewed publication push lands (~weekly). A cron would
# re-measure identical code daily; one snapshot per publication push
# is the natural perf-regression granularity. `workflow_dispatch`
# stays for ad-hoc runs from the Actions UI.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench-deep:
    name: bench-deep (tape)
    runs-on: ubuntu-latest
    # bench-deep itself is ≤20 min warm, but a cold runner pays the
    # idris2 bootstrap + `make install` elaboration + the Axis C/D
    # example builds from scratch.
    timeout-minutes: 60
    steps:
      # Full history: the composite's git-restore-mtime needs per-file
      # last-commit dates for the TTC-cache reuse.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # torch deps: every Python invocation in the bench path goes
      # through `uv run` inside packages/pytorch (bench-ops-py /
      # bench-layers-py, the Axis C/D PyTorch refs, and the Idris-side
      # hf_tokenize subprocess). No pack: the bench path doesn't drive
      # the pack-built test harnesses.
      - uses: ./.github/actions/setup-idris-ml
        id: setup
        with:
          os-label: ubuntu-latest
          backend-deps: torch
          ttc-job: bench-deep
          swap: 'true'

      - name: Build tape backend
        run: env BACKEND=tape make backend

      - name: Run bench-deep
        run: make bench-deep

      - name: Verify BENCHMARKS.md is in sync with perf-log.jsonl
        # Catches a hand-edit of BENCHMARKS.md that drifts from the
        # JSONL truth. Runs here (not test.yml) because this workflow
        # produces the entries it checks.
        if: ${{ !cancelled() }}
        run: make test-integration-lint-benchmarks

      - name: Run perf-regression gate (kind="op_bench", advisory)
        if: ${{ !cancelled() }}
        run: make test-integration-lint-perf-regression

      - name: Run perf-regression gate (kind="run" entries, advisory)
        # Groups perf-log.jsonl `kind="run"` entries by (example,
        # backend, args), medians the last 10, and reports OK / WARN
        # (>15%) / FAIL (>100% slower) for the latest entry per cell.
        # Advisory only — exits 0 even on FAILs — until the noise
        # profile is calibrated; promote by setting PERF_GATE=1.
        if: ${{ !cancelled() }}
        run: make lint-perf-run

      - name: Save caches
        if: always()
        uses: ./.github/actions/save-idris-ml-caches
        with:
          os-label: ubuntu-latest
          idris2-cache-hit: ${{ steps.setup.outputs.idris2-cache-hit }}
          ttc-job: bench-deep

      - name: Upload perf-log.jsonl
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: perf-log
          path: docs/develop/perf-log.jsonl

      - name: Upload BENCHMARKS.md
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: benchmarks-md
          path: BENCHMARKS.md
