name: perf

# Tier 2 perf cadence (see docs/develop/testing-taxonomy.md). Runs the
# `bench-nightly` aggregator end-to-end on Ubuntu and uploads the
# refreshed perf-log.jsonl + BENCHMARKS.md as artifacts. Today covers
# Axes A (op kernels), B (single-layer fwd+bwd), C (e2e training), and
# the BERT + GPT-2 cells of Axis D (HF inference). The Llama-generate
# cell of Axis D needs torch-mps F32 (Apple Silicon) — it's not
# available on this Ubuntu runner so it lands on a developer's local
# perf-nightly.sh run, not this CI workflow.
#
# Trigger is push-to-main, not a nightly cron: day-to-day work happens
# on the private mirror (CI disabled) and this public repo only moves
# when a reviewed publication push lands (~weekly). A cron would
# re-measure identical code daily; one snapshot per publication push
# is the natural perf-regression granularity. `workflow_dispatch`
# stays for ad-hoc runs from the Actions UI.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    name: perf (tape)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install chez + pip deps
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme python3-pip libopenblas-dev
          # transformers is needed for Axis D BERT + GPT-2 (Idris-side
          # tokenize subprocess + PyTorch ref). The Llama-generate cell
          # of Axis D is locally-gated (torch-mps) and naturally skips
          # on this runner since no MPS is available.
          pip3 install --user torch numpy transformers

      - name: Install idris2
        run: |
          # Match the install path used by .github/workflows/test.yml.
          git clone --depth 1 https://github.com/idris-lang/Idris2.git /tmp/Idris2
          cd /tmp/Idris2 && make bootstrap SCHEME=chezscheme && sudo make install

      - name: Build tape backend
        run: env BACKEND=tape make backend

      - name: Run bench-nightly
        run: make bench-nightly

      - name: Upload perf-log.jsonl
        uses: actions/upload-artifact@v4
        with:
          name: perf-log
          path: docs/develop/perf-log.jsonl

      - name: Upload BENCHMARKS.md
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-md
          path: BENCHMARKS.md
