name: Save idris-ml caches
description: >
  Paired saves for setup-idris-ml's cache restores. Jobs call this as
  their LAST step with `if: always()` — a mostly-built tree from a red
  run still saves the next run's elaboration (the plain actions/cache
  form only saves on job success, which starved every cache while a
  workflow was red). Composite actions have no post-steps, so this
  can't live inside setup-idris-ml itself. cache/save skips gracefully
  when a key already exists (logged as a benign "reserve" failure).

inputs:
  os-label:
    description: Runner label used in cache keys (must match setup).
    required: true
  idris2-cache-hit:
    description: >
      setup-idris-ml's idris2-cache-hit output; the toolchain is
      immutable per key so it's only saved after a real bootstrap.
    default: "true"
  save-pack:
    description: Save the pack cache (jobs that ran with-pack).
    default: "false"
  save-ttc:
    description: Save the TTC/object caches.
    default: "true"
  save-datasets:
    description: >
      Save the dataset cache. Only the jobs that actually fetch
      datasets (the e2e example matrix) should pass true — everywhere
      else data/ doesn't exist and the save step warns with a Path
      Validation Error, or the key already exists and the save warns
      on reserve (5 of run 27373449876's 10 cache-save warnings).
    default: "false"
  save-hf-models:
    description: Save the HF model cache (the HF-roundtrip job).
    default: "false"
  hf-cache-suffix:
    description: >
      Suffix slotted into the HF model cache key (must match setup).
      Empty keeps the historical shared key; the llama job passes
      "llama-" so its multi-GB store doesn't collide with the
      bert/gpt2 + fixtures cache.
    default: ""
  save-pytorch-venv:
    description: Save the uv venv (jobs that ran backend-deps torch).
    default: "false"
  pytorch-venv-cache-hit:
    description: >
      setup-idris-ml's pytorch-venv-cache-hit output; the venv only
      changes when uv.lock does (= the key changes), so skip the save
      when the restore hit — it can only warn on reserve.
    default: "false"
  ttc-job:
    description: Job-distinct TTC key suffix (must match setup).
    default: "build"

runs:
  using: composite
  steps:
    - name: Save TTC cache
      if: inputs.save-ttc == 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          build
          packages/*/build
          vendored
          packages/idris-ml-examples/src/BuildConfig.idr
          packages/idris-ml/src/HwConfig.idr
          packages/idris-ml/src/HwExecutors.idr
          packages/idris-ml/src/Test/Config.idr
          packages/idris-transformers/src/Test/Config.idr
        key: ttc-${{ inputs.os-label }}-v3-${{ github.sha }}-${{ inputs.ttc-job }}

    - name: Save dataset cache
      if: inputs.save-datasets == 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          data
          packages/pytorch/data
        key: datasets-${{ inputs.os-label }}-${{ hashFiles('mk/examples.mk') }}

    - name: Save HF model cache
      if: inputs.save-hf-models == 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          models
          ~/.cache/huggingface
        key: hf-models-${{ inputs.os-label }}-${{ inputs.hf-cache-suffix }}${{ hashFiles('mk/examples.mk') }}

    - name: Save pack cache
      if: inputs.save-pack == 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          ~/.local/bin/pack
          ~/.local/state/pack
          ~/.config/pack
        key: pack-${{ inputs.os-label }}-${{ hashFiles('pack.toml') }}-${{ github.sha }}

    - name: Save Idris 2 cache
      if: inputs.idris2-cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ~/.idris2
        key: idris2-v0.8.0-${{ inputs.os-label }}-v2

    - name: Save pytorch venv cache
      if: inputs.save-pytorch-venv == 'true' && inputs.pytorch-venv-cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: packages/pytorch/.venv
        key: pytorch-venv-${{ runner.os }}-${{ hashFiles('packages/pytorch/uv.lock') }}
