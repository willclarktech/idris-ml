name: Setup idris-ml build environment
description: >
  Shared setup for every idris-ml CI job. The toolchain (chez, pack,
  clang-tools, cppcheck, criterion, uv, openblas, …) comes from the repo
  flake — jobs install nix (DeterminateSystems/nix-installer-action) and
  set `defaults.run.shell: nix develop .#default --command bash -e {0}` so
  their make steps run inside the pinned dev shell. This composite no
  longer installs any toolchain; it does the cache restores, source-mtime
  handling, the swapfile, the pack-collection bootstrap, and the backend
  Python deps. Composite steps do NOT inherit the job's `defaults.run.shell`
  (they carry their own `shell: bash`), so the steps that need the flake
  toolchain wrap their commands in `nix develop "$GITHUB_WORKSPACE#default"
  --command …` explicitly. Paired with save-idris-ml-caches (called as the
  job's last step; composite actions have no post-steps).

inputs:
  os-label:
    description: >
      Runner label used in cache keys (ubuntu-latest / macos-latest).
      Passed explicitly (matrix.os or hardcoded) rather than derived
      from runner.os so the pre-composite cache keys stay valid.
    required: true
  backend-deps:
    description: >
      Backend Python deps to install: none | torch | mlx, or a
      space-separated combination ("mlx torch" — the macOS test-unit
      leg needs libtorch for test-unit-multi-backend and uv for the
      tokenizer-test subprocess alongside mlx).
    default: "none"
  with-pack:
    description: >
      Bootstrap the pinned pack collection (needed by the pack-driven
      test-unit-idris-* targets; the bench/backend paths don't use pack).
      The pack binary itself comes from the flake — this only builds the
      collection's compiler + libs into ~/.local/state/pack (cached).
    default: "false"
  restore-ttc:
    description: Restore the TTC/object + dataset caches.
    default: "true"
  restore-hf-models:
    description: >
      Restore the HF model cache (only the job running the HF
      roundtrip gates needs the multi-GB model store).
    default: "false"
  hf-cache-suffix:
    description: >
      Suffix slotted into the HF model cache key, so jobs holding
      disjoint model sets (small bert/gpt2 + fixtures vs the multi-GB
      llama/bitnet store) don't fight over one immutable key. Empty
      keeps the historical shared key; the llama job passes "llama-".
    default: ""
  ttc-job:
    description: >
      Job-distinct suffix for the per-sha TTC cache key. Each job
      saves its own enriched tree; restores fall back to the same-sha
      build tree, then the newest tree from any sha.
    default: "build"
  swap:
    description: Add a swapfile (Linux only; no-op on macOS).
    default: "false"
  swap-gb:
    description: >
      Swapfile size in GB. The default 8 covers ordinary cold-tree
      elaboration; the HF-roundtrip job passes 16 (HfBitNet/HfLlama
      example elaboration OOM-killed the runner at 16 GB RAM + 8 GB
      swap — run 27373449876).
    default: "8"

outputs:
  pytorch-venv-cache-hit:
    description: >
      Whether packages/pytorch/.venv came from cache (only meaningful
      when backend-deps included torch). Pass to save-idris-ml-caches
      so the multi-GB venv is only saved after a real uv sync — a
      same-key re-save is a guaranteed "unable to reserve" warning.
    value: ${{ steps.pytorch-venv-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # Chez elaboration of a cold tree (library + a large example in one
    # cascade) peaks past the 16 GB runner RAM. Swap trades speed for
    # survival on the cold path; warm TTC trees don't touch it. /swapfile8
    # avoids colliding with any image-provided /mnt/swapfile.
    - name: Add swapfile
      if: inputs.swap == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo fallocate -l ${{ inputs.swap-gb }}G /swapfile8
        sudo chmod 600 /swapfile8
        sudo mkswap /swapfile8
        sudo swapon /swapfile8
        free -h
        df -h /

    # idris2 and make decide rebuilds by mtime. Checkout stamps all files
    # "now", which would make every cached TTC / object look stale;
    # restore-mtime resets each file to its last-touching commit's date so
    # unchanged sources stay older than the cached tree and elaboration is
    # skipped. Needs fetch-depth: 0 on the checkout. git-restore-mtime is in
    # the flake's default shell (git-tools).
    - name: Restore source mtimes for incremental rebuilds
      shell: bash
      run: nix develop "$GITHUB_WORKSPACE#default" --command git restore-mtime

    # pack (Idris package manager) drives the per-package unit-test builds
    # (test-unit-idris-*): the shared idris-test harness depends on hedgehog,
    # which only pack's curated collection provides. The pack BINARY comes
    # from the flake; this cache holds the collection's built compiler + libs
    # under ~/.local/state/pack (cold bootstrap ~15-25 min; warm restore is
    # seconds), keyed on the pinned pack.toml.
    # Unconditional since the single-compiler refactor: pack's idris2 is THE
    # compiler for every `make install` / `make backend` (the Makefile's
    # `$(IDRIS2)` = `pack app-path idris2`), so every composite-using job —
    # not just the pack-driven test-unit-idris-* ones — needs it built. The
    # `with-pack` input is now redundant (kept on the call sites until a
    # follow-up removes it): `pack install idris-test` below is the
    # deterministic trigger that builds the pinned idris2, and the small
    # collection libs it also pulls (hedgehog, …) are cheap and cached.
    - name: Restore pack cache
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.local/state/pack
          ~/.config/pack
        key: pack-${{ inputs.os-label }}-${{ hashFiles('pack.toml') }}-${{ github.sha }}
        restore-keys: |
          pack-${{ inputs.os-label }}-${{ hashFiles('pack.toml') }}-
          pack-${{ inputs.os-label }}-

    - name: Bootstrap pinned pack toolchain (idris2 compiler + test collection)
      shell: bash
      # Runs inside the flake shell so `pack` (and the chez it builds idris2
      # with) resolve. Front-loads what the pack-driven test targets would
      # lazily install, and purges STALE local packages from a prefix-fallback
      # cache restore (see the .build-commit soundness note below).
      run: |
        nix develop "$GITHUB_WORKSPACE#default" --command bash -euo pipefail <<'NIXSH'
        pack info
        # SOUNDNESS — purge STALE local packages from the pack store. The pack
        # cache is restored via prefix fallback from an earlier commit, so its
        # installed copies of the workspace's own packages can be stale. pack
        # rebuilds a local package only when its source mtime is newer than the
        # install — but `git restore-mtime` stamped sources with OLD commit
        # dates, so pack keeps the stale copy. The store records the commit it
        # was built at (.build-commit, written by save-idris-ml-caches); remove
        # every local package whose source changed since then. Unchanged
        # packages and the expensive EXTERNAL collection (hedgehog, contrib, …)
        # stay warm. Store layout: ~/.local/state/pack/install/<commit>/<pkg>/.
        store="$HOME/.local/state/pack"
        packcommit=""
        [ -f "$store/.build-commit" ] && packcommit="$(cat "$store/.build-commit")"
        purge_all=0
        if [ -z "$packcommit" ] || ! git cat-file -e "${packcommit}^{commit}" 2>/dev/null; then
          echo "pack store commit unknown/unreachable — purging all local packages."
          purge_all=1
          changed=""
        else
          echo "pack store built at $packcommit; purging local packages changed since."
          changed="$(git diff --name-only "${packcommit}" HEAD -- packages/)"
        fi
        for name in idris-ml idris-ml-examples idris-gym idris-transformers \
                    idris-test idris-args idris-fmt; do
          if [ "$purge_all" = 1 ] || printf '%s\n' "$changed" | grep -q "^packages/${name}/"; then
            echo "  purging stale local package from pack store: $name"
            rm -rf "$store"/install/*/"$name"
          fi
        done
        # Installing the shared test harness (idris-test, carries hedgehog)
        # forces the pinned collection's compiler to build as a side effect —
        # deterministic here + lands in the pack cache.
        pack --no-prompt install idris-test
        NIXSH

    # Torch lane: the uv-managed venv under packages/pytorch carries libtorch
    # (the Makefile's LIBTORCH_PATH detection finds the venv's torch
    # automatically) plus transformers for the HF oracles. uv comes from the
    # flake; `make ref-setup` runs `uv sync` inside the flake shell.
    - name: Restore pytorch venv cache
      if: contains(inputs.backend-deps, 'torch')
      id: pytorch-venv-cache
      uses: actions/cache/restore@v5
      with:
        path: packages/pytorch/.venv
        key: pytorch-venv-${{ runner.os }}-${{ hashFiles('packages/pytorch/uv.lock') }}

    - name: Install torch + transformers via uv
      if: contains(inputs.backend-deps, 'torch')
      shell: bash
      run: nix develop "$GITHUB_WORKSPACE#default" --command make ref-setup

    # MLX is Apple-only. Pip wheel ships C++ headers + libs in the package's
    # site-packages dir under {include,lib}; the Makefile's BACKEND=mlx rules
    # read MLX_SITE to find them. Installed against the runner's system python3
    # (NOT nix — mlx needs the Metal-capable pip wheel); detection tries both
    # mlx and mlx-metal (0.31+ split the C++ headers into mlx-metal).
    - name: Install MLX
      if: contains(inputs.backend-deps, 'mlx')
      shell: bash
      run: |
        python3 -m pip install --break-system-packages mlx
        MLX_SITE=$(python3 -c "
        import importlib.util, os, sys
        for name in ('mlx', 'mlx_metal'):
            spec = importlib.util.find_spec(name)
            if not spec: continue
            path = spec.submodule_search_locations[0] if spec.submodule_search_locations \
                else os.path.dirname(spec.origin)
            if os.path.isdir(os.path.join(path, 'include')):
                print(path); sys.exit(0)
        sys.exit(1)
        ")
        echo "MLX_SITE=$MLX_SITE" >> $GITHUB_ENV

    # TTC + object cache. Idris elaboration dominates every job's wall-clock;
    # with restored source mtimes idris2/make skip everything the cached tree
    # already covers. Per-sha + per-job keys: each job saves its own enriched
    # tree; restores prefer the same-sha build tree, then the newest tree from
    # any prior sha. The generated sources (BuildConfig.idr etc.) must be cached
    # too — regenerating them fresh would invalidate every downstream module.
    #
    # SOUNDNESS — cross-commit restore is incremental-safe only because the
    # "Reconcile mtimes" step below force-rebuilds whatever changed since the
    # restored tree's build commit (build/.cache-commit). Bump -v4 to flush a
    # wedged tree.
    - name: Restore TTC cache
      if: inputs.restore-ttc == 'true'
      uses: actions/cache/restore@v5
      with:
        path: |
          build
          packages/*/build
          vendored
          packages/idris-ml-examples/src/BuildConfig.idr
          packages/idris-ml/src/HwConfig.idr
          packages/idris-ml/src/HwExecutors.idr
          packages/idris-ml/src/Test/Config.idr
          packages/idris-transformers/src/Test/Config.idr
        key: ttc-${{ inputs.os-label }}-v4-${{ github.sha }}-${{ inputs.ttc-job }}
        restore-keys: |
          ttc-${{ inputs.os-label }}-v4-${{ github.sha }}-
          ttc-${{ inputs.os-label }}-v4-

    # Make cross-commit cache restore sound: touch every path that changed
    # between the restored tree's build commit (build/.cache-commit) and HEAD
    # to NOW, so idris2 rebuilds exactly those modules (source newer than .ttc)
    # and cascades to importers. Unchanged sources keep their old mtime and stay
    # warm. Plain bash — git is on the runner; no flake toolchain needed.
    - name: Reconcile source mtimes against the restored TTC tree
      if: inputs.restore-ttc == 'true'
      shell: bash
      run: |
        cached=""
        [ -f build/.cache-commit ] && cached="$(cat build/.cache-commit)"
        if [ -z "$cached" ]; then
          echo "No build/.cache-commit (cold or pre-v4 tree) — nothing to reconcile."
          exit 0
        fi
        if ! git cat-file -e "${cached}^{commit}" 2>/dev/null; then
          echo "Cached commit ${cached} not in history (rebased away?) — forcing full rebuild."
          find packages \( -name '*.idr' -o -name '*.ipkg' \) -print0 | xargs -0r touch
          exit 0
        fi
        echo "Restored tree was built at ${cached}; touching files changed since then:"
        git diff --name-only "${cached}" HEAD | sed 's/^/  /'
        git diff -z --name-only "${cached}" HEAD | xargs -0r touch -c

    # Datasets the e2e example runs fetch (MNIST, SST-2, torch_ref downloads).
    # File-as-make-target, so a restored file is simply not re-fetched.
    - name: Restore dataset cache
      if: inputs.restore-ttc == 'true'
      uses: actions/cache/restore@v5
      with:
        path: |
          data
          packages/pytorch/data
        key: datasets-${{ inputs.os-label }}-${{ hashFiles('mk/examples.mk') }}
        restore-keys: datasets-${{ inputs.os-label }}-

    # HF model + tokenizer cache for the roundtrip gates. models/ holds the
    # Make-fetched safetensors (file-as-target), ~/.cache/huggingface the
    # transformers-side oracle downloads. Keyed on examples.mk; prefix restore
    # keeps old models while a new one downloads.
    - name: Restore HF model cache
      if: inputs.restore-hf-models == 'true'
      uses: actions/cache/restore@v5
      with:
        path: |
          models
          ~/.cache/huggingface
        key: hf-models-${{ inputs.os-label }}-${{ inputs.hf-cache-suffix }}${{ hashFiles('mk/examples.mk') }}
        restore-keys: hf-models-${{ inputs.os-label }}-${{ inputs.hf-cache-suffix }}
