[project]
name = "idris-ml-jupyter"
version = "0.1.0"
description = "Jupyter kernel for idris-ml — deep learning with dependent types"
requires-python = ">=3.9"
dependencies = [
    "jupyter-client>=7.0",
    "ipykernel>=6.0",
    "pexpect>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "nbconvert>=7.0"]
lab = ["jupyterlab>=3.0"]

[project.scripts]
idris-ml-kernel-install = "idris_ml_kernel.install:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["idris_ml_kernel*"]

[tool.pyright]
# Selected via `pyright -p packages/jupyter` (run from the
# packages/pytorch venv that carries pyright — see mk/lint.mk
# typecheck-py-jupyter). Import resolution for ipykernel /
# jupyter_client / pexpect / pytest comes from this package's own
# pip venv via venvPath, not from the pytorch venv.
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["idris_ml_kernel", "tests"]
