[project]
name = "idris-ml-torch-ref"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "safetensors>=0.7.0",
    "psutil>=7.0",
    # gymnasium for canonical RL envs in the torch_ref scripts.
    # Migration replaces hand-rolled env physics with `gym.make(...)`
    # so torch refs consume Gymnasium directly and idris-gym parity
    # can be validated against the upstream.
    "gymnasium>=1.0",
    # mlx for the MLX backend C++ bindings (used at build time by the
    # idris-ml Makefile, not by the torch reference scripts themselves).
    # Darwin-only — mlx ships Metal kernels and doesn't build on Linux.
    # `uv sync` installs into packages/pytorch/.venv/lib/python*/site-packages/mlx
    # on macOS; the Makefile's MLX_SITE resolution finds it there.
    "mlx>=0.31; sys_platform == 'darwin'",
    # HuggingFace transformers — used by packages/idris-transformers's
    # save_oracle.py to load a real HF model and produce the forward-pass
    # oracle that Example/HfBertInference compares against. Not consumed
    # by torch_ref's reference implementations.
    "transformers>=4.40",
    "accelerate>=1.13.0",
    # HuggingFace datasets — used by scripts/hf-download-dataset.sh to
    # fetch + tokenize GLUE / IMDb / similar text-classification corpora
    # into the local data/hf-datasets/<repo>/ TSV cache that the
    # HfDataset.idr loader consumes.
    "datasets>=3.0",
    # HuggingFace PEFT — used by the BERT SST-2 LoRA worked example's
    # paired reference (packages/pytorch/torch_ref/scripts/bert_classify_sst2_lora_finetune.py)
    # and by validate_lora_adapter.py for cross-tool round-trip of
    # idris-ml-saved LoRA adapters into PeftModel.from_pretrained.
    "peft>=0.14",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "pyright>=1.1",
    "vulture>=2.16",
]

[tool.uv]
# Force a uv-managed (python-build-standalone) interpreter rather than the
# runner's system python. The BitNet oracle (save_oracle_bitnet.py) makes
# torch._inductor JIT-compile a C++ dequant kernel, which #includes the
# running python's pyconfig.h. The CI runner's system python3.12 lacks the
# multiarch dev header (x86_64-linux-gnu/python3.12/pyconfig.h, an apt
# python3.12-dev artifact) now that the toolchain comes from nix, not apt —
# so inductor failed with "fatal error: ... pyconfig.h: No such file".
# uv-managed pythons ship complete headers, and this matches the repo rule
# of sourcing Python only through uv. venv layout (.venv/lib/python3.12/
# site-packages) is unchanged, so MLX_SITE resolution still finds mlx.
python-preference = "only-managed"

# [tool.ruff] config lives at the repo root in ruff.toml — ancestor-
# walk discovery picks it up from every .py file. Don't duplicate
# the rule set here.

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.vulture]
# 80% strikes the right balance: 60% (default) flags too many false
# positives on dataclass fields / argparse callbacks / interface
# stubs (anything looked up by name rather than reference); 90%+
# would miss real dead code with one off-the-beaten-path call site.
min_confidence = 80
exclude = [".venv/", "build/"]
paths = ["torch_ref", "../../scripts"]
