[project]
name = "idris-ml-torch-ref"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "safetensors>=0.7.0",
    "psutil>=7.0",
    # mlx for the MLX backend C++ bindings (used at build time by the
    # idris-ml Makefile, not by the torch reference scripts themselves).
    # Darwin-only — mlx ships Metal kernels and doesn't build on Linux.
    # `uv sync` installs into packages/pytorch/.venv/lib/python*/site-packages/mlx
    # on macOS; the Makefile's MLX_SITE resolution finds it there.
    "mlx>=0.31; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "pyright>=1.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]
ignore = ["N812"]  # Allow import torch.nn.functional as F (PyTorch convention)

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
