# gcovr configuration — gcov-based C/C++ coverage for the three backends
# (tape / torch / mlx). Read automatically by gcovr when invoked from the repo
# root (which is the --root). Pairs with codecov.yml (the gating layer) and
# docs/develop/coverage-policy.md (policy + the triage/exclusion rubric).
#
# This is the gcov-native successor to the retired llvm-cov COV_IGNORE_REGEX in
# mk/tests.mk. The coverage stack is gcov-based (not llvm source-based) so that
# genuinely-untestable lines can carry an INLINE, reviewable exclusion marker
# right at the source line — `// GCOVR_EXCL_LINE — <reason>` or a
# GCOVR_EXCL_START/STOP block. Every inline marker MUST carry a reason comment
# (enforced by the coverage-exclusion lint); exclusion is a high bar.
#
# NOTE: --gcov-executable is passed from mk/tests.mk, NOT set here — it is
# platform-conditional (`xcrun llvm-cov gcov` on macOS, `llvm-cov gcov` on
# Linux, since the coverage build forces the nix clang on Linux). Keeping it out
# of this committed file avoids baking a host-specific launcher into the repo.

# Branch-noise suppression. gcov over-counts compiler-generated branches
# (exception unwinding, unreachable defaults); these flags keep branch% honest.
exclude-unreachable-branches = yes
exclude-throw-branches = yes
exclude-noncode-lines = yes

# Unsupported-dtype dispatch arms (one rule, not ~12 identical inline markers).
# Every per-shape streamed dispatcher on mlx (and the tape `_f32` alias stubs)
# ends in a `default:` that calls a [[noreturn]] `*_dtype_unsupported(` /
# `*_f32_unsupported(` helper. These arms are unreachable on every CI lane: the
# Idris `Compatible` type gate forbids the out-of-set dtags from ever reaching
# the C dispatcher, so no test input can drive them. The matched lines are the
# helper CALL sites (+ the helper signature line); each helper's abort BODY
# still carries an inline GCOVR_EXCL block with its own reason.
exclude-lines-by-pattern = .*_(dtype|f32)_unsupported\(.*

# ---------------------------------------------------------------------------
# File/path exclusions (whole files with no correctness path to cover).
# Repeated `exclude =` keys each add a regex filter matched against the source
# path. Two classes, matching the FFI gap probe's principled-exclusion
# philosophy (coverage-policy.md "Principled exclusions"):
#   - the test files themselves — we measure the code under test, not the tests
#   - vendored third-party code we neither author nor test (cJSON)
#   - file-format I/O + diagnostics with no correctness path: safetensors +
#     shared_utils (format I/O), mnist + idx (dataset readers, covered by
#     example-mnist), log + probes (logging/diagnostics), and the
#     diagnostics/profiling/dtype_init basenames nested under backend_*/training/
#     (telemetry + pure dispatch-table init, same class as op_dispatch init).
# Real kernel + training C (backend_*/**, shared/training/**) otherwise stays IN.
# Per-file torch/mlx PASSTHROUGH exclusions live in codecov.yml `ignore:` (they
# are a Phase-2 per-file determination), not here.
# ---------------------------------------------------------------------------
exclude = .*/test_[^/]*\.(c|cpp)$
exclude = (.*/)?vendored/.*
exclude = .*/(safetensors|shared_utils|mnist|idx|log|probes)\.(c|cpp)$
exclude = .*/(diagnostics|profiling|dtype_init)\.(c|cpp)$
# Third-party headers pulled in by the mlx/torch backends: the framework's own
# headers under the pip venv (mlx/include/*.h) and any system/nix toolchain
# headers. We measure idris-ml's C/C++, not libtorch's or mlx's. (Restores the
# .venv + system-path drops the retired COV_IGNORE_REGEX carried.)
exclude = (.*/)?\.venv/.*
exclude = .*/site-packages/.*
exclude = /(nix|usr|opt|Library|System)/.*
